# Deploy to Sovrium Cloud (https://cloud.sovrium.com).
#
# Manual only (workflow_dispatch) for now: installing Sovrium depends on
# `sovrium.com/install`, which was unavailable (TLS error) when this workflow
# was last checked. Until a run succeeds, deploy locally with
# `bash scripts/deploy.sh` (after `sovrium login`).
#
# Requires the repository secret SOVRIUM_API_KEY: a Sovrium Cloud API key
# (create one with `sovrium login` on a trusted machine, or from the cloud).
name: Deploy to Sovrium Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovrium-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SOVRIUM_APP: mercipourtonnon
      SOVRIUM_HOST: https://cloud.sovrium.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Sovrium
        run: |
          curl -fsSL https://sovrium.com/install | sh
          # Cover the common install locations, then verify
          echo "$HOME/.sovrium/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.sovrium/bin:$HOME/.local/bin:$PATH"
          command -v sovrium || { echo 'sovrium not on PATH after install:'; find "$HOME" -maxdepth 4 -name sovrium -type f 2>/dev/null; exit 1; }
          sovrium --version

      - name: Validate configuration
        run: sovrium validate app.yaml

      - name: Sign in to Sovrium Cloud
        env:
          SOVRIUM_API_KEY: ${{ secrets.SOVRIUM_API_KEY }}
        run: sovrium login --host "$SOVRIUM_HOST" --api-key "$SOVRIUM_API_KEY"

      - name: Deploy
        run: sovrium deploy app.yaml --host "$SOVRIUM_HOST" --app "$SOVRIUM_APP"
