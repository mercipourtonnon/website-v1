<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>date-range-picker — mercipourtonnon component kit</title>
<link rel="stylesheet" href="../css/brand-fonts.css">
<link rel="stylesheet" href="kit.css">
</head>
<body class="bg-background text-foreground">
<main>
<div class="bg-background text-foreground flex flex-col gap-6 p-6" data-testid="container" data-component-type="container" role="group"><h2 class="text-lg font-semibold" data-testid="child-0" data-component-type="text">date-range-picker — light</h2><div class="flex flex-col gap-2" data-testid="child-1" data-component-type="container" role="group"><p class="text-xs text-muted-foreground" data-testid="child-0" data-component-type="text">default</p><div data-testid="child-1" data-island="date-range-picker" data-component-type="date-range-picker" data-island-props="{&quot;label&quot;:&quot;Period&quot;,&quot;value&quot;:&quot;2026-09-01/2026-09-30&quot;,&quot;presets&quot;:[&quot;this-month&quot;,&quot;last-month&quot;,&quot;this-quarter&quot;]}"><span class="text-md block font-medium">Period</span><div role="status" aria-busy="true" class="text-foreground-subtle border-border overflow-hidden rounded border p-3" style="min-height:2.25em"></div></div></div></div><div class="dark bg-background text-foreground flex flex-col gap-6 p-6" data-testid="container" data-component-type="container" role="group"><h2 class="text-lg font-semibold" data-testid="child-0" data-component-type="text">date-range-picker — dark</h2><div class="flex flex-col gap-2" data-testid="child-1" data-component-type="container" role="group"><p class="text-xs text-muted-foreground" data-testid="child-0" data-component-type="text">default</p><div data-testid="child-1" data-island="date-range-picker" data-component-type="date-range-picker" data-island-props="{&quot;label&quot;:&quot;Period&quot;,&quot;value&quot;:&quot;2026-09-01/2026-09-30&quot;,&quot;presets&quot;:[&quot;this-month&quot;,&quot;last-month&quot;,&quot;this-quarter&quot;]}"><span class="text-md block font-medium">Period</span><div role="status" aria-busy="true" class="text-foreground-subtle border-border overflow-hidden rounded border p-3" style="min-height:2.25em"></div></div></div></div>
</main>
</body>
</html>
