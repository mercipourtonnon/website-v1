name: mercipourtonnon
description: Ateliers de consentement à prix libre à Strasbourg

# Hide the "Built with Sovrium" pill rendered bottom-right on every page
badge: false

# Built-in privacy-friendly analytics (server-side; inert on static hosting)
analytics: true

design:
  $ref: ./config/design.yaml

# Authentication — needed for the admin console (/_admin) and the design-system
# console on a dev server. No public sign-up: accounts are created by an admin
# (first one via AUTH_ADMIN_EMAIL / AUTH_ADMIN_PASSWORD in .env, or `sovrium admin create`).
# Inert on the static GitHub Pages build.
auth:
  strategies:
    - type: emailAndPassword
  allowSignUp: false
  defaultRole: member

components:
  - $ref: ./config/components/site-footer.yaml
  - $ref: ./config/components/event-date-row.yaml
  - $ref: ./config/components/testimonial-card.yaml
  - $ref: ./config/components/audience-card.yaml
  - $ref: ./config/components/value-card.yaml
  - $ref: ./config/components/team-card.yaml
  - $ref: ./config/components/site-header.yaml
  - $ref: ./config/components/partner-card.yaml
  - $ref: ./config/components/resource-card.yaml
  - $ref: ./config/components/knowledge-card.yaml
  - $ref: ./config/components/term-card.yaml

pages:
  - $ref: ./config/pages/home.yaml
  - $ref: ./config/pages/mentions-legales.yaml
  - $ref: ./config/pages/newsletter.yaml
  - $ref: ./config/pages/le-consentement.yaml
  - $ref: ./config/pages/ressources.yaml
