name: mercipourtonnon
description: Ateliers de consentement gratuits à Strasbourg

# Hide the "Built with Sovrium" pill rendered bottom-right on every page
badge: false

# Built-in privacy-friendly analytics (server-side; inert on static hosting)
analytics:
  # The private Espace and sign-in pages are not audience traffic.
  excludedPaths: [/_admin/*, /api/*, /connexion, /inscription, /espace, /espace/*]

design:
  $ref: ./config/design.yaml

# Data model — workshop catalogue and the facilitators' proposal workflow,
# then the espace bénévole (members, agenda, needs, sign-ups, news).
tables:
  - $ref: ./config/tables/facilitators.yaml
  - $ref: ./config/tables/venues.yaml
  - $ref: ./config/tables/workshop_proposals.yaml
  - $ref: ./config/tables/workshops.yaml
  - $ref: ./config/tables/members.yaml
  - $ref: ./config/tables/events.yaml
  - $ref: ./config/tables/event_needs.yaml
  - $ref: ./config/tables/event_participations.yaml
  - $ref: ./config/tables/news.yaml
  # Dashboard /espace/suivi: who registered, who came, what the date brought in.
  - $ref: ./config/tables/registrations.yaml
  - $ref: ./config/tables/workshop_cash.yaml
  # /ressources: the curated external references (table `ressources`: `references` is a reserved SQL word) (seeded, public read).
  - $ref: ./config/tables/ressources.yaml
  # /vos-idees: ideas sent by the public (coordination-only read).
  - $ref: ./config/tables/ideas.yaml

# Authentication and roles (candidat → member / facilitateur → coordination → admin).
auth:
  $ref: ./config/auth.yaml

# Environment the app needs (values live in .env, names in .env.example).
# HELLOASSO_BILLETERIE_PLUS_API_KEY is deliberately NOT declared: it only serves
# the legacy script in scripts/.
env:
  - { key: HELLOASSO_CLIENT_ID, description: HelloAsso API client id (needs the FormAdministration privilege) }
  - { key: HELLOASSO_CLIENT_SECRET, description: HelloAsso API client secret }
  - { key: HELLOASSO_ORGANIZATION_SLUG, description: HelloAsso organisation slug (e.g. merci-pour-ton-non), secret: false }
  - key: HELLOASSO_API_BASE_URL
    description: HelloAsso API root — https://api.helloasso.com/v5 (sandbox https://api.helloasso-sandbox.com/v5)
    secret: false
  - key: HELLOASSO_TOKEN_URL
    description: HelloAsso OAuth2 token endpoint — https://api.helloasso.com/oauth2/token (sandbox https://api.helloasso-sandbox.com/oauth2/token)
    secret: false
  - { key: HELLOASSO_CONTACT_EMAIL, description: Contact email shown on each HelloAsso event, secret: false }
  - key: HELLOASSO_WEBHOOK_TOKEN
    description: Secret in the HelloAsso notification URL (?token=…) — sovrium secret generate
    required: false
  - { key: ADMIN_NOTIFY_EMAIL, description: Who is emailed when a HelloAsso automation fails (optional), required: false, secret: false }
  # Espace bénévole — Brevo contacts and campaigns (the same key also serves
  # EMAIL_PROVIDER=brevo for transactional mail), and the WhatsApp community.
  - { key: BREVO_API_KEY, description: Brevo API key (contacts and email campaigns) }
  - { key: BREVO_LIST_BENEVOLES_ID, description: Id of the Brevo list of validated bénévoles (a number), secret: false }
  - { key: BREVO_SENDER_EMAIL, description: Sender address of the news campaigns (a verified Brevo sender), secret: false }
  - { key: BREVO_SENDER_NAME, description: Sender name of the news campaigns (e.g. Merci pour ton non), secret: false }
  - { key: WHATSAPP_COMMUNITY_URL, description: Invitation link to the bénévoles' WhatsApp community, secret: false }
  - key: BASE_URL
    description: Public origin of the app (https://mercipourtonnon.fr), used for links in emails
    secret: false

connections:
  - $ref: ./config/connections/helloasso.yaml
  - $ref: ./library/connection/brevo.yaml

# Reusable automation steps.
actions:
  - $ref: ./config/actions/build-workshop-payload.yaml

# Proposal → approval → HelloAsso event → public catalogue.
automations:
  - $ref: ./config/automations/approve-workshop-proposal.yaml
  - $ref: ./config/automations/create-helloasso-event.yaml
  - $ref: ./config/automations/retry-helloasso.yaml
  - $ref: ./config/automations/publish-workshop-on-site.yaml
  - $ref: ./config/automations/notify-helloasso-failure.yaml
  # Espace bénévole.
  - $ref: ./config/automations/save-member-profile.yaml
  - $ref: ./config/automations/on-sign-up.yaml
  - $ref: ./config/automations/validate-member.yaml
  - $ref: ./config/automations/refuse-member.yaml
  - $ref: ./config/automations/archive-member.yaml
  - $ref: ./config/automations/on-member-validated.yaml
  - $ref: ./config/automations/on-member-archived.yaml
  - $ref: ./config/automations/on-news-published.yaml
  - $ref: ./config/automations/on-participation.yaml
  - $ref: ./config/automations/label-event-date.yaml
  - $ref: ./config/automations/label-news-date.yaml
  - $ref: ./config/automations/label-need.yaml
  - $ref: ./config/automations/notify-espace-failure.yaml
  # HelloAsso registrations → `registrations` (button, cron, webhook), check-in, retention.
  - $ref: ./config/automations/sync-workshop-registrations.yaml
  - $ref: ./config/automations/sync-helloasso-registrations.yaml
  - $ref: ./config/automations/sync-helloasso-registrations-cron.yaml
  - $ref: ./config/automations/helloasso-notification.yaml
  - $ref: ./config/automations/stamp-check-in.yaml
  - $ref: ./config/automations/anonymise-registrations.yaml
  # Public ideas form → mail to the coordination.
  - $ref: ./config/automations/on-idea.yaml

components:
  - $ref: ./config/components/site-footer.yaml
  - $ref: ./config/components/event-date-row.yaml
  - $ref: ./config/components/testimonial-card.yaml
  - $ref: ./config/components/audience-card.yaml
  - $ref: ./config/components/value-card.yaml
  - $ref: ./config/components/team-card.yaml
  - $ref: ./config/components/site-header.yaml
  - $ref: ./config/components/partner-card.yaml
  # Logo-less partner row — /notre-mission#partenaires and /nos-interventions#references.
  - $ref: ./config/components/partner-row.yaml
  - $ref: ./config/components/resource-card.yaml
  - $ref: ./config/components/knowledge-card.yaml
  - $ref: ./config/components/term-card.yaml
  # « Besoin d'aide maintenant ? » — on /nos-ateliers#cadre and /ressources.
  - $ref: ./config/components/help-now-band.yaml
  - $ref: ./config/components/espace-shell.yaml
  # Espace bénévole cards (row templates over events, news and members).
  - $ref: ./config/components/event-card.yaml
  - $ref: ./config/components/news-card.yaml
  - $ref: ./config/components/member-card.yaml
  - $ref: ./config/components/whatsapp-card.yaml

pages:
  - $ref: ./config/pages/home.yaml
  # Public site (review of 2026-10-09): Notre mission · Nos actions ▾ · Ressources.
  - $ref: ./config/pages/notre-mission.yaml
  - $ref: ./config/pages/nos-ateliers.yaml
  - $ref: ./config/pages/nos-stands.yaml
  - $ref: ./config/pages/nos-interventions.yaml
  - $ref: ./config/pages/mentions-legales.yaml
  - $ref: ./config/pages/newsletter.yaml
  - $ref: ./config/pages/le-consentement.yaml
  - $ref: ./config/pages/ressources.yaml
  # One page per published workshop date (/ateliers/:slug).
  - $ref: ./config/pages/atelier.yaml
  # Espace facilitateur·ices and coordination (private, noindex, out of the sitemap).
  - $ref: ./config/pages/espace-connexion.yaml
  - $ref: ./config/pages/espace-accueil.yaml
  - $ref: ./config/pages/espace-proposer.yaml
  - $ref: ./config/pages/espace-proposition.yaml
  - $ref: ./config/pages/espace-validation.yaml
  - $ref: ./config/pages/espace-ateliers.yaml
  # Espace bénévole (private, noindex, out of the sitemap).
  - $ref: ./config/pages/espace-inscription.yaml
  - $ref: ./config/pages/espace-arrivee.yaml
  - $ref: ./config/pages/espace-en-attente.yaml
  - $ref: ./config/pages/espace-agenda.yaml
  - $ref: ./config/pages/espace-agenda-evenement.yaml
  - $ref: ./config/pages/espace-actualites.yaml
  - $ref: ./config/pages/espace-actualite.yaml
  - $ref: ./config/pages/espace-membres.yaml
  - $ref: ./config/pages/espace-membre.yaml
  - $ref: ./config/pages/espace-profil.yaml
  - $ref: ./config/pages/espace-coordination-membres.yaml
  - $ref: ./config/pages/espace-coordination-agenda.yaml
  - $ref: ./config/pages/espace-coordination-actualites.yaml
  # Le jour J: figures per date, and each date's check-in screen.
  - $ref: ./config/pages/espace-suivi.yaml
  - $ref: ./config/pages/espace-suivi-date.yaml

# Standalone forms, embedded in pages with formRef.
forms:
  # Facilitators propose a workshop date (embedded on /espace/proposer).
  - $ref: ./config/forms/proposer-un-atelier.yaml
  # Espace bénévole: member profile and event sign-up.
  - $ref: ./config/forms/member-profile.yaml
  - $ref: ./config/forms/event-participation.yaml
  # On /espace/suivi/:id: a walk-in, and the first entry of the dons sur place (form prix-libre-sur-place).
  - $ref: ./config/forms/ajout-sur-place.yaml
  - $ref: ./config/forms/prix-libre-sur-place.yaml
  # Public: anyone can send an idea (embedded on /vos-idees, also at /forms/idees).
  - $ref: ./config/forms/idees.yaml

# URLs of the retired static (GitHub Pages) export.
redirects:
  - { from: /index.html, to: / }
  - { from: /newsletter.html, to: /newsletter }
  - { from: /mentions-legales.html, to: /mentions-legales }
