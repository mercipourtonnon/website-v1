# "Approuver" button (Cercle Gardien and admin): proposed → approved. The status change starts
# create-helloasso-event, which creates the real HelloAsso event.
name: approve-workshop-proposal
description: Valide une proposition d'atelier ; déclenche la création de l'événement HelloAsso.
trigger:
  type: manual
  label: Approuver
  # A single role name (an admin satisfies any). permissions.trigger spells out
  # who may press it and can only narrow requiredRole. Pressing it runs with
  # the presser's rights, so gardien needs write on the rows it changes.
  # Not the logistique group: requiredRole and permissions.trigger read the
  # caller's role only (Sovrium 0.34.1); see workshop_proposals.yaml.
  requiredRole: gardien
permissions:
  trigger: [gardien, admin]
timeout: 30000
actions:
  # Table button → {{trigger.input.recordId}}. A page button must pass `recordId` too.
  - name: proposal
    type: record
    operator: read
    props:
      table: workshop_proposals
      id: '{{trigger.input.recordId}}'
  - name: only_proposed
    type: filter
    operator: continue
    props:
      condition:
        conditions:
          - { field: '{{proposal.record.status}}', operator: equals, value: proposed }
  - name: approve
    type: record
    operator: update
    props:
      table: workshop_proposals
      filter:
        conditions:
          - { field: id, operator: equals, value: '{{proposal.record.id}}' }
      data:
        status: approved
