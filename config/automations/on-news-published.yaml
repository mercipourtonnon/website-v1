# A news item is (or becomes) published:
#   1. published_at is set if it is still empty;
#   2. if « Envoyer par email » is ticked and no campaign exists yet, one Brevo
#      campaign goes to the bénévoles list: create-email-campaign, then its id
#      is saved at once, then send-email-campaign-now.
#
# Sent once: brevo_campaign_id is the guard. It is checked on a fresh read and
# written right after the create, so re-saving, unpublishing and republishing,
# or replaying the run never creates a second campaign. The create is never
# retried (a POST that timed out may have created the campaign); any failure
# sets send_status: failed with the reason, fails the run, and
# notify-espace-failure tells the coordination. A campaign created but not
# sent can be sent from Brevo; a failed create saves no id, so publishing
# again (or ticking « Envoyer par email » again) retries it.
#
# Loop check: watches status and send_email; writes published_at,
# brevo_campaign_id, send_status and send_error only.
name: on-news-published
description: Date la publication d'une actualité et l'envoie une seule fois par campagne Brevo aux bénévoles.
trigger:
  type: record
  table: news
  events: [create, update]
  watchFields: [status, send_email]
  condition:
    conditions:
      - { field: '{{trigger.data.record.status}}', operator: equals, value: published }
timeout: 180000
actions:
  - name: news
    type: record
    operator: read
    props:
      table: news
      id: '{{trigger.data.record.id}}'
  - name: still_published
    type: filter
    operator: continue
    props:
      condition:
        conditions:
          - { field: '{{news.record.status}}', operator: equals, value: published }

  # 1. Publication date.
  - name: date_it
    type: path
    operator: branch
    props:
      mode: first-match
      paths:
        - name: undated
          condition:
            conditions:
              - { field: '{{news.record.published_at}}', operator: isEmpty }
          actions:
            - name: set_published_at
              type: record
              operator: update
              props:
                table: news
                filter:
                  conditions:
                    - { field: id, operator: equals, value: '{{news.record.id}}' }
                data:
                  published_at: '{{now}}'
        - name: dated
          actions:
            - name: already_dated
              type: data
              operator: set
              props:
                value: dated

  # 2. Email, once.
  - name: wants_email
    type: filter
    operator: continue
    props:
      condition:
        logic: and
        conditions:
          - { field: '{{news.record.send_email}}', operator: equals, value: true }
          - { field: '{{news.record.brevo_campaign_id}}', operator: isEmpty }

  - name: campaign
    type: code
    operator: runTypescript
    props:
      timeout: 60000
      inputData:
        id: '{{news.record.id}}'
        title: '{{news.record.title}}'
        summary: '{{news.record.summary}}'
        body: '{{news.record.body}}'
      code: |
        async function execute(context) {
          const input = context.inputData as Record<string, unknown>;
          const id = String(input.id || '').trim();
          const title = String(input.title || '').trim();
          if (!id || !title) throw new Error('Actualité sans identifiant ou sans titre.');
          const listId = Number(context.env.BREVO_LIST_BENEVOLES_ID);
          if (!Number.isInteger(listId) || listId <= 0) {
            throw new Error('BREVO_LIST_BENEVOLES_ID doit être un nombre entier.');
          }
          const base = String(context.env.BASE_URL || '').replace(/\/+$/, '');
          const link = `${base}/espace/actualites/${encodeURIComponent(id)}`;

          function escapeHtml(value: string): string {
            return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          }
          // The body is rich text written by the coordination; scripts, styles
          // and inline handlers are dropped before it goes into an email.
          function cleanHtml(value: string): string {
            return value
              .replace(/<\s*(script|style|iframe|object|embed)[\s\S]*?<\s*\/\s*\1\s*>/gi, '')
              .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
              .replace(/javascript:/gi, '');
          }
          const summary = String(input.summary || '').trim();
          const body = cleanHtml(String(input.body || ''));

          const html = `<!doctype html><html lang="fr"><body style="margin:0;padding:0;background:#f7f7f7;">
            <div style="max-width:600px;margin:0 auto;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;background:#ffffff;">
              <p style="margin:0 0 24px;font-size:14px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;color:#F5004F;">Merci pour ton non · Espace bénévole</p>
              <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">${escapeHtml(title)}</h1>
              ${summary ? `<p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#444;">${escapeHtml(summary).replace(/\n/g, '<br>')}</p>` : ''}
              <div style="font-size:16px;line-height:1.6;">${body}</div>
              <p style="margin:32px 0;"><a href="${escapeHtml(link)}" style="display:inline-block;padding:12px 20px;background:#1a1a1a;color:#ffffff;text-decoration:none;border-radius:6px;">Lire sur l'espace bénévole</a></p>
              <p style="margin:32px 0 0;font-size:12px;color:#777;">Tu reçois ce message parce que tu fais partie des bénévoles de Merci pour ton non.
                <a href="{{ unsubscribe }}" style="color:#777;">Se désinscrire</a></p>
            </div></body></html>`;

          let res: { data?: Record<string, unknown> };
          try {
            res = (await context.actions.connection.call({
              connection: 'brevo',
              operation: 'create-email-campaign',
              params: {
                name: `Actualité ${id} — ${title}`.slice(0, 250),
                subject: title,
                previewText: summary.slice(0, 140),
                sender: { name: String(context.env.BREVO_SENDER_NAME || ''), email: String(context.env.BREVO_SENDER_EMAIL || '') },
                recipients: { listIds: [listId] },
                htmlContent: html,
                tag: 'espace-benevole-actualite',
              },
              timeout: 45000,
            })) as unknown as { data?: Record<string, unknown> };
          } catch (error) {
            // Reported, not thrown: the news must show « Échec » with the reason.
            return { campaignId: '', status: 'failed', error: `Création de la campagne Brevo échouée : ${String((error as Error).message || error)}` };
          }
          const campaignId = res && res.data && res.data.id ? String(res.data.id) : '';
          if (!campaignId) return { campaignId: '', status: 'failed', error: 'Brevo n\'a pas renvoyé d\'identifiant de campagne.' };
          return { campaignId, status: 'sending', error: '' };
        }

  # Saved at once: from here on the news is never sent twice. A failed create
  # saves no id, so publishing again (untick and tick « Envoyer par email »)
  # retries it.
  - name: save_campaign
    type: record
    operator: update
    props:
      table: news
      filter:
        conditions:
          - { field: id, operator: equals, value: '{{news.record.id}}' }
      data:
        brevo_campaign_id: '{{campaign.campaignId}}'
        send_status: '{{campaign.status}}'
        send_error: '{{campaign.error}}'

  - name: maybe_send
    type: path
    operator: branch
    props:
      mode: first-match
      paths:
        - name: created
          condition:
            conditions:
              - { field: '{{campaign.campaignId}}', operator: isNotEmpty }
          actions:
            - name: send
              type: connection
              operator: call
              continueOnError: true
              timeout: 45000
              retry: { maxAttempts: 3, delayMs: 5000, strategy: exponential }
              props:
                connection: brevo
                operation: send-email-campaign-now
                params:
                  campaignId: '{{campaign.campaignId}}'
        - name: not_created
          actions:
            - name: send_skipped
              type: data
              operator: set
              props:
                value: skipped

  - name: outcome
    type: code
    operator: runTypescript
    props:
      timeout: 5000
      inputData:
        createError: '{{campaign.error}}'
        sendStep: '{{send}}'
      code: |
        async function execute(context) {
          const input = context.inputData as Record<string, unknown>;
          const createError = String(input.createError || '');
          if (createError) return { ok: false, status: 'failed', error: createError };
          const s = (input.sendStep && typeof input.sendStep === 'object' ? input.sendStep : {}) as Record<string, unknown>;
          let error = typeof s.error === 'string' ? s.error : '';
          const attempts = Array.isArray(s.attempts) ? (s.attempts as Array<Record<string, unknown>>) : [];
          const last = attempts[attempts.length - 1];
          if (!error && last && last.error) error = String(last.error);
          return error ? { ok: false, status: 'failed', error: `Envoi Brevo échoué : ${error}` } : { ok: true, status: 'sent', error: '' };
        }

  - name: save_outcome
    type: record
    operator: update
    props:
      table: news
      filter:
        conditions:
          - { field: id, operator: equals, value: '{{news.record.id}}' }
      data:
        send_status: '{{outcome.status}}'
        send_error: '{{outcome.error}}'

  # End a failed send as a FAILED run so notify-espace-failure fires (see
  # create-helloasso-event: flow/stop ends as completed-with-errors in 0.33.0).
  - name: fail_on_error
    type: code
    operator: runTypescript
    props:
      timeout: 2000
      inputData:
        ok: '{{outcome.ok}}'
        error: '{{outcome.error}}'
      code: |
        async function execute(context) {
          const input = context.inputData as Record<string, unknown>;
          if (input.ok === true || input.ok === 'true') return { ok: true };
          throw new Error(String(input.error || 'Envoi Brevo : erreur inconnue'));
        }
