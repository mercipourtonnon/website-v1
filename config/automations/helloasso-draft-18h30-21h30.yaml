# Creates one HelloAsso event as a DRAFT through the admin dashboard
# (admin.helloasso.com), for a workshop from 18:30 to 21:30 (Europe/Paris),
# signed in as HELLOASSO_ACCOUNT_EMAIL. Called by migrate-billetterie-plus (and
# create-helloasso-event); nothing is published: the Cercle Gardien reviews
# the draft and publishes it on HelloAsso.
#
# One automation per time slot (helloasso-draft-10h-13h, -14h-17h,
# -18h30-21h30), identical but for the two time blocks — keep them so. In
# Sovrium 0.35.0 a time input ignores `fill` and a step's `key` is never
# templated, so the times are typed as literal key presses; and a browser
# run inside a `path` branch renders none of its templates, so the slot
# cannot be a branch here. Merge the three once those are fixed.
#
# At most once per event: the « Enregistrer » click that creates the draft is
# `irreversible` and keyed by `slug`, so a replay returns the first draft.
# Callers still look the title up first (list-events).
#
# Locators are the dashboard's own data-testid attributes (mapped on
# 2026-10-10). Needs BROWSER_PROVIDER=webview, and a real Chrome
# (BROWSER_CDP_URL): HelloAsso's bot check turns a headless one away.
name: helloasso-draft-18h30-21h30
description: Crée en brouillon un événement HelloAsso (18:30–21:30) depuis le tableau de bord.
trigger:
  type: automation-call
  inputSchema:
    slug: { type: string }
    title: { type: string }
    # dd/mm/yyyy, Europe/Paris
    date: { type: string }
    placeName: { type: string }
    street: { type: string }
    zipCode: { type: string }
    city: { type: string }
timeout: 300000
actions:
  - name: draft
    type: browser
    operator: run
    timeout: 280000
    props:
      allowedHosts: [helloasso.com, '*.helloasso.com']
      session: helloasso-admin
      idempotencyKey: 'helloasso-event-{{trigger.input.slug}}'
      timeouts: { stepMs: 30000, runMs: 240000 }
      artifacts: { screenshots: steps }
      steps:
        - do: goto
          label: Page de création
          url: https://admin.helloasso.com/merci-pour-ton-non/evenements/creation
        # Sign-in, skipped while the stored session is still valid.
        - do: fill
          label: Email
          target: { label: Email }
          value: $env.HELLOASSO_ACCOUNT_EMAIL
          optional: true
        - do: fill
          label: Mot de passe
          target: { label: Mot de passe }
          value: $env.HELLOASSO_ACCOUNT_PASSWORD
          optional: true
        - do: click
          label: Accéder à mon compte
          target: { role: button, name: Accéder à mon compte }
          optional: true
        - do: dismiss
          label: Bandeau cookies
          target: { role: button, name: Continuer sans accepter }
          timeoutMs: 3000
        # Step 1 « Informations générales ».
        - do: fill
          label: Nom de la campagne
          target: { testId: input-campaign-name }
          value: '{{trigger.input.title}}'
        - do: select
          label: Type de campagne
          target: { testId: select-campaign-type }
          option: Atelier, stage, activité
        - do: fill
          label: Lieu
          target: { testId: input-campaign-place-name }
          value: '{{trigger.input.placeName}}'
        - do: click
          label: Adresse manuelle
          target: { role: button, name: Je veux saisir mon adresse manuellement }
        - do: fill
          label: Rue
          target: { testId: input-place-address }
          value: '{{trigger.input.street}}'
        - do: fill
          label: Code postal
          target: { testId: input-place-zip-code }
          value: '{{trigger.input.zipCode}}'
        - do: fill
          label: Ville
          target: { testId: input-place-city }
          value: '{{trigger.input.city}}'
        - do: select
          label: Pays
          target: { testId: select-place-country }
          option: France
        - do: click
          label: Sur une journée
          target: { text: Sur une journée, exact: true }
        - do: fill
          label: Date
          target: { testId: input-campaign-start-date }
          value: '{{trigger.input.date}}'
        # Escape leaves the date picker open over the time fields; a click outside
        # closes it.
        - do: click
          label: Fermer le calendrier
          target: { role: heading, name: Durée de l'événement }
        - do: click
          label: Heure de début
          target: { testId: input-campaign-start-time }
        - do: press
          label: Heure de début « 1 »
          key: '1'
        - do: press
          label: Heure de début « 8 »
          key: '8'
        - do: press
          label: Heure de début « 3 »
          key: '3'
        - do: press
          label: Heure de début « 0 »
          key: '0'
        - do: click
          label: Heure de fin
          target: { testId: input-campaign-end-time }
        - do: press
          label: Heure de fin « 2 »
          key: '2'
        - do: press
          label: Heure de fin « 1 »
          key: '1'
        - do: press
          label: Heure de fin « 3 »
          key: '3'
        - do: press
          label: Heure de fin « 0 »
          key: '0'
        - do: waitFor
          label: TEMP-REHEARSAL
          target: { text: TEMP-REHEARSAL-STOP }
          timeoutMs: 1000
        - do: click
          label: Enregistrer (crée le brouillon)
          target: { role: button, name: Enregistrer, exact: true }
          irreversible: true
        # Saved: the dashboard moves on to « Montants et options ».
        - do: waitFor
          label: Étape 2
          target: { text: Montants et options }
        - do: screenshot
          name: brouillon-cree
          fullPage: true

  - name: done
    type: automation
    operator: return
    props:
      data:
        url: '{{draft.url}}'
        skipped: '{{draft.skipped}}'
