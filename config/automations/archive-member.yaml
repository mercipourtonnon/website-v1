# "Archiver" (coordination): validated → archived. The status change starts
# on-member-archived (back to candidat, removed from the Brevo list).
#
# Pressing it runs with the presser's rights: the coordination may write any
# members row (row rule on editor_role) and its status. Only the status is
# written here; the record automation does the rest as the system.
name: archive-member
description: Archive un·e bénévole qui quitte l'équipe ; on-member-archived retire son accès.
trigger:
  type: manual
  label: Archiver
  # requiredRole takes ONE role name (an admin satisfies any of them);
  # permissions.trigger spells out who may press it and can only narrow it.
  requiredRole: coordination
permissions:
  trigger: [coordination, admin]
timeout: 30000
actions:
  # Table button → {{trigger.input.recordId}}. A page button must pass `recordId` too.
  - name: member
    type: record
    operator: read
    props:
      table: members
      id: '{{trigger.input.recordId}}'
  - name: only_validated
    type: filter
    operator: continue
    props:
      condition:
        conditions:
          - { field: '{{member.record.status}}', operator: equals, value: validated }
  - name: set_status
    type: record
    operator: update
    props:
      table: members
      filter:
        conditions:
          - { field: id, operator: equals, value: '{{member.record.id}}' }
      data:
        status: archived
