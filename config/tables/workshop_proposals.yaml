# One row per workshop date a facilitator proposes. Private: it holds the
# approval workflow (proposed → approved → helloasso_draft → published, plus
# rejected, withdrawn and sync_error). The public catalogue is `workshops`.
#
# A facilitateur·ice (group facilitation) reads only the proposals she made,
# creates them as `proposed`, and edits or deletes them only while they are
# still `proposed`. The Cercle Gardien reads and updates every proposal and runs
# Approuver / Publier / Réessayer. Status, review and HelloAsso fields are
# written by the Cercle Gardien, an admin or the automations — never by a
# facilitateur·ice.
#
# Why not the logistique group: a button's automation and a field `write` grant
# read the caller's role only (Sovrium 0.34.1), and a facilitator holds the same
# role (coeur) as a logisticien·ne. Opening approval to a role would open it to
# every facilitator, on her own dates too.
id: 3
name: workshop_proposals
fields:
  # Day + wall-clock time in Europe/Paris. Kept apart (no datetime) so the form
  # never round-trips through UTC; build-workshop-payload turns them into ISO.
  - { id: 1, name: session_date, label: Date, type: date, required: true, weekday: long }
  - id: 2
    name: start_time
    label: Heure de début
    type: single-select
    required: true
    options: ['10:00', '14:00', '18:30']
  - { id: 3, name: duration_minutes, label: Durée (minutes), type: integer, default: 180, min: 30, max: 600 }
  - id: 4
    name: lead_facilitator
    label: Facilitateur·ice principal·e
    type: relationship
    relatedTable: facilitators
    relationType: many-to-one
    displayField: display_name
    required: true
    onDelete: restrict
  - id: 5
    name: co_facilitator
    label: Co-facilitateur·ice
    type: relationship
    relatedTable: facilitators
    relationType: many-to-one
    displayField: display_name
    onDelete: set-null
  - id: 6
    name: venue
    label: Lieu
    type: relationship
    relatedTable: venues
    relationType: many-to-one
    displayField: name
    onDelete: restrict
  - { id: 7, name: capacity, label: Places, type: integer, default: 15, min: 1, max: 200 }
  - { id: 8, name: note_to_team, label: Note pour l'équipe, type: long-text }
  - { id: 9, name: proposed_by, label: Proposé par, type: created-by }
  - id: 10
    name: status
    label: Statut
    type: status
    required: true
    default: proposed
    options:
      - { value: proposed, label: À relire, color: '#FFAF00' }
      - { value: approved, label: Création HelloAsso en cours, color: '#7B01FE' }
      - { value: helloasso_draft, label: À finaliser sur HelloAsso, color: '#FF7000' }
      - { value: published, label: En ligne, color: '#12A19D' }
      - { value: rejected, label: Non retenue, color: '#130077' }
      - { value: withdrawn, label: Retirée, color: '#130077' }
      - { value: sync_error, label: Erreur HelloAsso, color: '#F5004F' }
  - { id: 11, name: reviewer_note, label: Note de relecture, type: long-text }
  - { id: 12, name: helloasso_form_slug, label: Slug HelloAsso, type: single-line-text, unique: true }
  - { id: 13, name: helloasso_url, label: Lien HelloAsso, type: url }
  - { id: 14, name: sync_error, label: Erreur de synchronisation, type: long-text }
  # Row actions. Visibility only; each automation gates who may run it.
  - id: 15
    name: approve
    type: button
    label: Approuver
    action: automation
    automation: approve-workshop-proposal
    visibleWhen: { field: status, eq: proposed }
  - id: 16
    name: publish
    type: button
    label: Publier sur le site
    action: automation
    automation: publish-workshop-on-site
    visibleWhen: { field: status, eq: helloasso_draft }
  - id: 17
    name: retry
    type: button
    label: Réessayer HelloAsso
    action: automation
    automation: retry-helloasso
    visibleWhen: { field: status, eq: sync_error }
  # Technical: holds `gardien` on every row so the row rules below let
  # that role through (a row rule cannot name a role; gardien also bypasses
  # row rules, being admin-equivalent). Never shown; admins only.
  # Existing rows: see the note at the end of this file.
  - { id: 18, name: editor_role, label: Rôle gestionnaire (technique), type: single-line-text, default: gardien }
  # Read by build-workshop-payload (HelloAsso title, description and place).
  - { id: 19, name: lead_name, label: Facilitateur·ice principal·e (nom), type: lookup, relationshipField: lead_facilitator, relatedField: display_name }
  - { id: 20, name: co_name, label: Co-facilitateur·ice (nom), type: lookup, relationshipField: co_facilitator, relatedField: display_name }
  - { id: 21, name: venue_name, label: Nom du lieu, type: lookup, relationshipField: venue, relatedField: name }
  - { id: 22, name: venue_city, label: Ville du lieu, type: lookup, relationshipField: venue, relatedField: city }
  - { id: 23, name: venue_zip_code, label: Code postal du lieu, type: lookup, relationshipField: venue, relatedField: zip_code }
permissions:
  read: ['group:facilitation', gardien, admin]
  create: ['group:facilitation', gardien, admin]
  update: ['group:facilitation', gardien, admin]
  delete: ['group:facilitation', gardien, admin]
  fields:
    - { field: status, write: [gardien, admin] }
    - { field: reviewer_note, write: [gardien, admin] }
    - { field: helloasso_form_slug, write: [gardien, admin] }
    - { field: helloasso_url, write: [gardien, admin] }
    - { field: sync_error, write: [gardien, admin] }
    - { field: capacity, write: [gardien, admin] }
    - { field: venue, write: [gardien, admin] }
    - { field: duration_minutes, write: [gardien, admin] }
    - { field: editor_role, read: [gardien, admin], write: [admin] }
# Admins bypass these rules (auth-access/auth-roles-rbac); automations started
# by a record event write as the system.
rowLevelPermissions:
  read:
    when:
      logic: or
      conditions:
        - field: proposed_by
          operator: eq
          value: { kind: currentUser, path: { kind: scalar, name: id } }
        - field: editor_role
          operator: eq
          value: { kind: currentUser, path: { kind: scalar, name: role } }
  create:
    when: { field: status, operator: eq, value: proposed }
  write:
    when:
      logic: or
      conditions:
        - logic: and
          conditions:
            - field: proposed_by
              operator: eq
              value: { kind: currentUser, path: { kind: scalar, name: id } }
            - { field: status, operator: eq, value: proposed }
        - field: editor_role
          operator: eq
          value: { kind: currentUser, path: { kind: scalar, name: role } }
  delete:
    when:
      logic: and
      conditions:
        - field: proposed_by
          operator: eq
          value: { kind: currentUser, path: { kind: scalar, name: id } }
        - { field: status, operator: eq, value: proposed }
# editor_role on existing rows: Sovrium 0.33 fills the new column's default
# into rows already there when the app starts (checked on SQLite: proposals
# created before the column read back `coordination`). Since the 2026-10
# governance roles, rows created before hold `coordination`: harmless (the
# gardien role bypasses row rules), and scripts/migrate-governance-roles.mjs
# rewrites them to `gardien`.
