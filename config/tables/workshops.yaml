# The public catalogue: one row per workshop date shown on the site. Rows are
# written by publish-workshop-on-site (or seeded for the legacy Billetterie Plus
# date). No row rule, so logged-out visitors and the sitemap can read it.
id: 4
name: workshops
fields:
  # e.g. 2026-11-28-14h — the /ateliers/:slug path.
  - { id: 1, name: slug, label: Slug, type: single-line-text, required: true, unique: true }
  # UTC instants (stored and read back as ...Z).
  - { id: 2, name: starts_at, label: Début, type: datetime, required: true }
  - { id: 3, name: ends_at, label: Fin, type: datetime }
  # Europe/Paris calendar day, for "upcoming" filters.
  - { id: 4, name: session_date, label: Date, type: date, required: true }
  # "samedi 28 novembre 2026" / "14h"
  - { id: 5, name: date_label, label: Date (texte), type: single-line-text }
  - { id: 6, name: time_label, label: Heure (texte), type: single-line-text }
  - id: 7
    name: lead_facilitator
    label: Facilitateur·ice principal·e
    type: relationship
    relatedTable: facilitators
    relationType: many-to-one
    displayField: display_name
    onDelete: restrict
  - id: 8
    name: co_facilitator
    label: Co-facilitateur·ice
    type: relationship
    relatedTable: facilitators
    relationType: many-to-one
    displayField: display_name
    onDelete: set-null
  - { id: 9, name: lead_name, label: Facilitateur·ice, type: lookup, relationshipField: lead_facilitator, relatedField: short_name }
  - { id: 10, name: co_name, label: Co-facilitateur·ice (nom), type: lookup, relationshipField: co_facilitator, relatedField: short_name }
  - id: 11
    name: venue
    label: Lieu
    type: relationship
    relatedTable: venues
    relationType: many-to-one
    displayField: name
    onDelete: restrict
  - { id: 12, name: venue_name, label: Nom du lieu, type: lookup, relationshipField: venue, relatedField: name }
  - { id: 13, name: venue_city, label: Ville, type: lookup, relationshipField: venue, relatedField: city }
  - { id: 14, name: capacity, label: Places, type: integer, default: 15 }
  - { id: 15, name: booking_url, label: Lien de réservation, type: url }
  - id: 16
    name: booking_provider
    label: Billetterie
    type: single-select
    default: helloasso
    options: [helloasso, billetterie_plus]
  - id: 17
    name: status
    label: Statut
    type: single-select
    required: true
    default: published
    options: [published, cancelled]
  # Back-office links, admin-only. No reverse link from proposals (a circular
  # relationship is rejected at boot).
  - id: 18
    name: proposal
    label: Proposition
    type: relationship
    relatedTable: workshop_proposals
    relationType: many-to-one
    onDelete: set-null
  - { id: 19, name: helloasso_form_slug, label: Slug HelloAsso, type: single-line-text }
  # ── Suivi (dashboard /espace/suivi). Staff-only: see the field rules below;
  # the table itself stays public for the site and the sitemap.
  - { id: 20, name: registrations, label: Inscriptions, type: relationship, relatedTable: registrations, relationType: one-to-many, foreignKey: workshop }
  - { id: 21, name: cash, label: Prix libre sur place (saisie), type: relationship, relatedTable: workshop_cash, relationType: one-to-many, foreignKey: workshop }
  - { id: 22, name: registrations_count, label: Inscrit·es, type: count, relationshipField: registrations, filters: { field: status, operator: equals, value: valid } }
  - id: 23
    name: present_count
    label: Présent·es
    type: count
    relationshipField: registrations
    filters:
      and:
        - { field: status, operator: equals, value: valid }
        - { field: attendance, operator: equals, value: present }
  # Online prix libre. One flat condition only: in 0.33.0 a rollup whose filter
  # is an and/or group crashes schema initialisation ("e.replace"). Cancelled and
  # refunded rows already carry 0 (the sync zeroes them) and on-site rows carry
  # none, so `valid` is enough. On-site money lives in workshop_cash.
  - id: 24
    name: revenue_online
    label: Prix libre en ligne
    type: rollup
    relationshipField: registrations
    relatedField: amount_paid
    aggregation: SUM
    format: currency
    filters: { field: status, operator: equals, value: valid }
  - { id: 25, name: revenue_on_site, label: Prix libre sur place, type: rollup, relationshipField: cash, relatedField: amount_on_site, aggregation: SUM, format: currency }
  - id: 26
    name: revenue_total
    label: Prix libre total
    type: formula
    formula: 'COALESCE(revenue_online, 0) + COALESCE(revenue_on_site, 0)'
    resultType: number
    format: currency
    currency: EUR
  - { id: 27, name: last_synced_at, label: Dernière synchronisation, type: datetime }
permissions:
  read: all
  create: [admin]
  update: [admin]
  delete: [admin]
  fields:
    - { field: proposal, read: [admin], write: [admin] }
    - { field: helloasso_form_slug, read: [admin], write: [admin] }
    - { field: registrations, read: [admin, member], write: [admin] }
    - { field: cash, read: [admin, member], write: [admin] }
    - { field: registrations_count, read: [admin, member], write: [admin] }
    - { field: present_count, read: [admin, member], write: [admin] }
    - { field: revenue_online, read: [admin, member], write: [admin] }
    - { field: revenue_on_site, read: [admin, member], write: [admin] }
    - { field: revenue_total, read: [admin, member], write: [admin] }
    - { field: last_synced_at, read: [admin, member], write: [admin] }
