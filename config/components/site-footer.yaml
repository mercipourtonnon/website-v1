# Shared footer — used by every public page.
# The "Le site" grid mirrors the header's IA (review of 2026-10-09). To add a
# page link, append one `link` to it — every entry has the same one-line
# shape; "Nous faire un don" opens the HelloAsso donation form, its URL
# repeated in 4 places (header ×2, footer, notre-mission) because a page href
# does not resolve `$env.X` on Sovrium 0.34.1.
# Links are root-absolute so they work from every page. Social networks are
# plain text links: Lucide has no brand marks, and the charter allows only
# Lucide icons.
name: site-footer
type: container
element: footer
props:
  className: bg-mauve-light border-t border-mauve-lighter
children:
  - type: container
    props:
      className: max-w-7xl mx-auto px-4 sm:px-6 py-16 grid gap-12 md:grid-cols-12
    children:
      # Identity
      - type: container
        props:
          className: md:col-span-5 flex flex-col gap-4
        children:
          - type: link
            props:
              href: /
              className: self-start
              aria-label: Merci pour ton non — accueil
            children:
              - type: image
                props:
                  src: /logo.svg
                  alt: ''
                  className: h-16 md:h-20 w-auto
          - type: text
            element: p
            props:
              className: type-small text-bleu-fonce-70 max-w-sm
            content: On anime des ateliers de consentement gratuits à Strasbourg. En 3h, on apprend à poser ses limites, à dire non et à accueillir celui des autres — dans un cadre bienveillant, ouvert à tou·te·s.
          - type: link
            props:
              href: mailto:mercipourtonnon@gmail.com
              className: self-start type-small font-bold text-mauve underline underline-offset-4 hover:text-pourpre-hover
            content: mercipourtonnon@gmail.com
      # Site links
      - type: container
        element: nav
        props:
          className: md:col-span-4 flex flex-col gap-3
          aria-label: Plan du site
        children:
          - type: text
            element: p
            props:
              className: type-overline text-bleu-fonce-70
            content: Le site
          - type: container
            props:
              className: grid grid-cols-2 gap-x-6 gap-y-2 type-small
            children:
              - type: link
                props: { href: /notre-mission, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Notre mission
              - type: link
                props: { href: /nos-ateliers, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Nos ateliers
              - type: link
                props: { href: /nos-stands, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Nos stands
              - type: link
                props: { href: /nos-interventions, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Nos interventions
              - type: link
                props: { href: /le-consentement, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Le consentement
              - type: link
                props: { href: /ressources, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Ressources
              - type: link
                props: { href: /notre-mission#equipe, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: L'équipe
              - type: link
                props: { href: /newsletter, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Newsletter
              # HelloAsso donation form — same URL in site-header, site-footer, notre-mission.
              - type: link
                props:
                  href: https://www.helloasso.com/associations/merci-pour-ton-non/formulaires/1
                  target: _blank
                  rel: noopener noreferrer
                  aria-label: Nous faire un don sur HelloAsso (nouvel onglet)
                  className: inline-flex items-center gap-1.5 py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline
                children:
                  - type: icon
                    props: { name: heart, size: 18, strokeWidth: 2, aria-hidden: 'true' }
                  - type: text
                    element: span
                    content: Nous faire un don
              - type: link
                props: { href: /mentions-legales, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Mentions légales
              - type: link
                props: { href: /espace, className: py-1 text-bleu-fonce hover:text-mauve underline-offset-4 hover:underline }
                content: Espace bénévole
      # Social
      - type: container
        props:
          className: md:col-span-3 flex flex-col gap-3
        children:
          - type: text
            element: p
            props:
              className: type-overline text-bleu-fonce-70
            content: Nous suivre
          - type: container
            props:
              className: flex flex-col gap-1 type-small
            children:
              - type: link
                props:
                  href: https://www.instagram.com/mercipourtonnon/
                  target: _blank
                  rel: noopener noreferrer
                  aria-label: Instagram (nouvel onglet)
                  className: inline-flex items-center gap-1.5 py-1 text-bleu-fonce hover:text-mauve
                children:
                  - type: text
                    element: span
                    content: Instagram
                  - type: icon
                    props: { name: arrow-up-right, size: 16 }
              - type: link
                props:
                  href: https://www.facebook.com/mercipourtonnon
                  target: _blank
                  rel: noopener noreferrer
                  aria-label: Facebook (nouvel onglet)
                  className: inline-flex items-center gap-1.5 py-1 text-bleu-fonce hover:text-mauve
                children:
                  - type: text
                    element: span
                    content: Facebook
                  - type: icon
                    props: { name: arrow-up-right, size: 16 }
              - type: link
                props:
                  href: https://www.linkedin.com/company/merci-pour-ton-non
                  target: _blank
                  rel: noopener noreferrer
                  aria-label: LinkedIn (nouvel onglet)
                  className: inline-flex items-center gap-1.5 py-1 text-bleu-fonce hover:text-mauve
                children:
                  - type: text
                    element: span
                    content: LinkedIn
                  - type: icon
                    props: { name: arrow-up-right, size: 16 }
  - type: container
    props:
      className: border-t border-mauve-lighter
    children:
      - type: text
        element: p
        props:
          className: max-w-7xl mx-auto px-4 sm:px-6 py-6 type-caption text-bleu-fonce-70
        content: © 2026 Merci pour ton non. Tous droits réservés.
