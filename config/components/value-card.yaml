# "Nos valeurs" card — vars: $icon (lucide name), $accent (text-orange — icon
# colour only), $title, $text. Full class tokens only.
name: value-card
type: container
props:
  className: flex flex-col gap-3 border-t-2 border-bleu-fonce-light pt-6
children:
  - type: icon
    props:
      name: $icon
      size: 28
      strokeWidth: 2
      className: $accent
  - type: text
    element: h3
    props:
      className: type-h4 text-bleu-fonce
    content: $title
  - type: text
    element: p
    props:
      className: type-small text-bleu-fonce-70
    content: $text
