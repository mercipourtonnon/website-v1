# Partner card — vars: $logo (/partners/x), $logoW / $logoH (intrinsic size),
# $tileBg (bg-white, or tile-bleu-fonce — a site.css class — for a white logo), $name,
# $text (one line), $href, $linkLabel ("Découvrir Le Labo des Partenariats").
name: partner-card
type: container
props:
  className: bg-white rounded-card shadow-card border border-bleu-fonce-light overflow-hidden flex flex-col
children:
  - type: container
    props:
      className: $tileBg h-40 flex items-center justify-center p-8
    children:
      - type: image
        props:
          src: $logo
          alt: $name
          loading: lazy
          className: max-h-24 w-auto object-contain
  - type: container
    props:
      className: p-6 flex flex-col gap-3 flex-1
    children:
      - type: text
        element: h3
        props:
          className: type-h4 text-bleu-fonce
        content: $name
      - type: text
        element: p
        props:
          className: type-small text-bleu-fonce-70 flex-1
        content: $text
      - type: link
        props:
          href: $href
          target: _blank
          rel: noopener noreferrer
          className: inline-flex items-center gap-1.5 self-start font-bold type-small text-mauve underline underline-offset-4 hover:text-pourpre-hover
        children:
          - type: text
            element: span
            content: $linkLabel
          - type: icon
            props: { name: arrow-up-right, size: 16, strokeWidth: 2 }
