# Espace bénévole — the app frame around every /espace page.
# Based on library block/shell-sidebar@0.33.0: a sidebar beside a main region
# that holds the page's own components (`children: $children`).
#
# Navigation follows the internal governance (config/auth.yaml): circles are
# roles, volunteer roles are groups (`group:<name>`). Each nav block is its own
# sidebar gated with `visibility.roles` on exactly who may open its pages — the
# unmet ones are left out of the HTML. A role list does not let an admin
# through unless it names `admin` (pages/pages-layouts-access, "Gating one
# component on who is reading"), and lists do not inherit, so every role is named:
#   member, coeur                → Espace bénévole
#   + group facilitation         → Mes ateliers, Le jour J
#   + group logistique           → Gestion (agenda), Le jour J
#   + group communication        → Gestion (agenda, actualités)
#   + group tresorerie           → Le jour J
#   gardien, admin               → everything, plus Bénévoles and the workshop review
# A candidat has no sidebar: her only page, /espace/en-attente, has no shell.
#
# Density: data screens use the default 36 px controls and medium table rows;
# body copy stays on the brand body face, headings on the title face.
# Status chips: see the `valueLabels` + `cellStyle` mapping on each grid.
name: espace-shell
type: container
props:
  className: min-h-screen flex flex-col bg-white text-bleu-fonce
children:
  # Top bar: brand, way back to the public site, sign out.
  - type: container
    element: header
    props:
      className: flex items-center justify-between gap-4 border-b border-mauve-lighter bg-white px-4 py-3 sm:px-6
    children:
      - type: link
        props:
          href: /espace
          className: flex items-center gap-3
        children:
          - type: image
            props:
              src: /logo-without-marging.svg
              alt: Merci pour ton non
              className: h-9 w-auto
          - type: text
            element: span
            props:
              className: hidden text-sm font-bold sm:inline
            content: Espace bénévole
      - type: container
        props:
          className: flex items-center gap-2 sm:gap-4
        children:
          - type: link
            props:
              href: /
              className: text-sm font-medium text-bleu-fonce underline underline-offset-4 hover:text-mauve
            content: Voir le site
          - type: button
            variant: outline
            size: sm
            label: Me déconnecter
            action:
              type: auth
              method: logout
              onSuccess: { type: navigate, navigate: /connexion }
  - type: flex
    props:
      className: flex w-full flex-1 items-stretch
    children:
      # One column of stacked sidebars, each gated on who may open its
      # targets. Volunteer roles (groups) add up, so a person can hold several:
      # exclusive per-audience variants are impossible, and a sidebar has no
      # per-entry role gate (0.34.1), hence one sidebar per audience, stacked.
      # Every list matches the `access` of the pages it links to.
      - type: container
        props:
          className: flex flex-none flex-col border-r border-mauve-lighter bg-orange-lighter py-4 md:w-64 md:px-2
        children:
          # Every validated bénévole (Abeilles, Cœur, Gardien).
          - type: sidebar
            visibility: { roles: [member, coeur, gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Navigation de l'espace
              className: &sidebarClassName w-full flex-none
            classes: &sidebarClasses
              parts:
                link: rounded-md text-bleu-fonce hover:bg-orange-light
                groupLabel: text-xs font-bold uppercase tracking-wide text-bleu-fonce-70
              states:
                current: { link: bg-white font-bold text-bleu-fonce shadow-sm }
            groups:
              - label: Espace bénévole
                items:
                  - { label: Accueil, href: /espace, icon: house }
                  - { label: Agenda, href: /espace/agenda, icon: calendar-days, activeMatch: prefix }
                  - { label: Actualités, href: /espace/actualites, icon: newspaper, activeMatch: prefix }
                  - { label: Membres, href: /espace/membres, icon: users, activeMatch: prefix }
                  - { label: Mon profil, href: /espace/profil, icon: user-round-pen }
          # Facilitation: her workshop proposals.
          - type: sidebar
            visibility: { roles: ['group:facilitation', gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Navigation des ateliers
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Mes ateliers
                items:
                  - { label: Mes propositions, href: /espace#mes-propositions, icon: list-checks }
                  - { label: Proposer une date, href: /espace/proposer, icon: calendar-plus }
          # Gestion: the agenda (logistique, communication), the news
          # (communication), then the Cercle Gardien's screens. Each audience
          # below is inside the first one, so the « Gestion » heading is always
          # drawn above them.
          - type: sidebar
            visibility: { roles: ['group:logistique', 'group:communication', gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Navigation de gestion
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Gestion
                items:
                  - { label: Agenda à gérer, href: /espace/coordination/agenda, icon: calendar-cog }
          - type: sidebar
            visibility: { roles: ['group:communication', gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Gestion des actualités
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - items:
                  - { label: Actualités à publier, href: /espace/coordination/actualites, icon: megaphone }
          - type: sidebar
            visibility: { roles: [gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Cercle Gardien
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - items:
                  - { label: Bénévoles, href: /espace/coordination/membres, icon: user-check }
                  - { label: Ateliers à valider, href: /espace/validation, icon: inbox, activeMatch: prefix }
                  - { label: Ateliers en ligne, href: /espace/ateliers, icon: calendar-check, activeMatch: prefix }
          # Day-of tools: facilitation and logistique point the people,
          # the trésorerie reads the figures and enters the prix libre.
          - type: sidebar
            visibility: { roles: ['group:facilitation', 'group:logistique', 'group:tresorerie', gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Navigation du jour J
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Le jour J
                items:
                  - { label: Suivi des ateliers, href: /espace/suivi, icon: clipboard-check, activeMatch: prefix }
      - type: container
        props:
          id: contenu
          className: min-w-0 flex-1 px-4 py-6 sm:px-10 sm:py-8
        children: $children
