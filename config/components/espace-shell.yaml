# Espace bénévole — the app frame around every /espace page.
# Based on library block/shell-sidebar@0.33.0: a sidebar beside a main region
# that holds the page's own components (`children: $children`).
#
# Navigation follows the internal governance (config/auth.yaml): circles are
# roles, volunteer roles are groups (`group:<name>`). The sidebar has one
# section per circle or volunteer role, labelled with it and listing that
# role's tools. Each section is its own sidebar gated with `visibility.roles`;
# the unmet ones are left out of the HTML. A role list does not let an admin
# through unless it names `admin` (pages/pages-layouts-access, "Gating one
# component on who is reading"), and lists do not inherit, so roles are named:
#   Espace bénévole  [member, coeur, gardien, admin]  Accueil, Agenda, Actualités, Membres, Mon profil
#   Facilitation     [group:facilitation]             Mes propositions, Proposer une date, Suivi des ateliers
#   Logistique       [group:logistique]               Agenda à gérer, Suivi des ateliers
#   Communication    [group:communication]            Actualités à publier, Agenda à gérer
#   Trésorerie       [group:tresorerie]               Recettes des ateliers (/espace/suivi: figures, prix libre)
#   Cercle Gardien   [gardien, admin]                 Bénévoles, Ateliers à valider, Ateliers en ligne,
#                                                     Agenda à gérer, Actualités à publier, Suivi, Proposer une date
# Group sections deliberately leave gardien/admin out: a gardien·ne sees
# « Espace bénévole » + « Cercle Gardien » with no duplicate. A Cœur member
# holding several volunteer roles sees a shared tool (e.g. Suivi) under each of
# her roles — accepted. Polyvalent·e has no tools of its own, so no section.
# Every list matches the `access` of the pages its links open.
# A candidat has no sidebar: her only page, /espace/en-attente, has no shell.
#
# Density: data screens use the default 36 px controls and medium table rows;
# body copy stays on the brand body face, headings on the title face.
# Status chips: see the `valueLabels` + `cellStyle` mapping on each grid.
name: espace-shell
type: container
props:
  className: min-h-screen flex flex-col bg-white text-bleu-fonce
children:
  # Top bar: brand, way back to the public site, sign out.
  - type: container
    element: header
    props:
      className: flex items-center justify-between gap-4 border-b border-mauve-lighter bg-white px-4 py-3 sm:px-6
    children:
      - type: link
        props:
          href: /espace
          className: flex items-center gap-3
        children:
          - type: image
            props:
              src: /logo-without-marging.svg
              alt: Merci pour ton non
              className: h-9 w-auto
          - type: text
            element: span
            props:
              className: hidden text-sm font-bold sm:inline
            content: Espace bénévole
      - type: container
        props:
          className: flex items-center gap-2 sm:gap-4
        children:
          - type: link
            props:
              href: /
              className: text-sm font-medium text-bleu-fonce underline underline-offset-4 hover:text-mauve
            content: Voir le site
          - type: button
            variant: outline
            size: sm
            label: Me déconnecter
            action:
              type: auth
              method: logout
              onSuccess: { type: navigate, navigate: /connexion }
  - type: flex
    props:
      className: flex w-full flex-1 items-stretch
    children:
      # One column of stacked sidebars, one per circle or volunteer role.
      # Volunteer roles (groups) add up, so a person can hold several:
      # exclusive per-audience variants are impossible, and a sidebar has no
      # per-entry role gate (0.34.1), hence one sidebar per role, stacked.
      # Every list matches the `access` of the pages it links to.
      - type: container
        props:
          className: flex flex-none flex-col border-r border-mauve-lighter bg-orange-lighter py-4 md:w-64 md:px-2
        children:
          # Every validated bénévole (Abeilles, Cœur, Gardien).
          - type: sidebar
            visibility: { roles: [member, coeur, gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Navigation de l'espace bénévole
              # Since Sovrium 0.38 the sidebar is shadcn/ui's: its own grey ground
              # and a pb-12 under each one. The stacked sidebars sit on the
              # column's cream instead, with no gap, at body size.
              className: &sidebarClassName "w-full flex-none bg-transparent [&_[data-slot=sidebar-content]]:pb-0"
            classes: &sidebarClasses
              parts:
                link: h-auto py-1.5 rounded-md text-md text-bleu-fonce hover:bg-orange-light
                groupLabel: text-xs font-bold uppercase tracking-wide text-bleu-fonce-70
              states:
                current: { link: bg-white font-bold text-bleu-fonce shadow-sm }
            groups:
              - label: Espace bénévole
                items:
                  - { label: Accueil, href: /espace, icon: house }
                  - { label: Agenda, href: /espace/agenda, icon: calendar-days, activeMatch: prefix }
                  - { label: Actualités, href: /espace/actualites, icon: newspaper, activeMatch: prefix }
                  - { label: Membres, href: /espace/membres, icon: users, activeMatch: prefix }
                  - { label: Mon profil, href: /espace/profil, icon: user-round-pen }
          # Facilitation: her workshop proposals and the day-of follow-up.
          - type: sidebar
            visibility: { roles: ['group:facilitation'] }
            rail: { below: md }
            props:
              aria-label: Navigation facilitation
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Facilitation
                items:
                  - { label: Mes propositions, href: /espace#mes-propositions, icon: list-checks }
                  - { label: Proposer une date, href: /espace/proposer, icon: calendar-plus }
                  - { label: Suivi des ateliers, href: /espace/suivi, icon: clipboard-check, activeMatch: prefix }
          # Logistique: the agenda and the day-of follow-up.
          - type: sidebar
            visibility: { roles: ['group:logistique'] }
            rail: { below: md }
            props:
              aria-label: Navigation logistique
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Logistique
                items:
                  - { label: Agenda à gérer, href: /espace/coordination/agenda, icon: calendar-cog }
                  - { label: Suivi des ateliers, href: /espace/suivi, icon: clipboard-check, activeMatch: prefix }
          # Communication: the news, then the agenda.
          - type: sidebar
            visibility: { roles: ['group:communication'] }
            rail: { below: md }
            props:
              aria-label: Navigation communication
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Communication
                items:
                  - { label: Actualités à publier, href: /espace/coordination/actualites, icon: megaphone }
                  - { label: Agenda à gérer, href: /espace/coordination/agenda, icon: calendar-cog }
          # Trésorerie: the figures and the prix libre, on the follow-up page.
          - type: sidebar
            visibility: { roles: ['group:tresorerie'] }
            rail: { below: md }
            props:
              aria-label: Navigation trésorerie
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Trésorerie
                items:
                  - { label: Recettes des ateliers, href: /espace/suivi, icon: coins, activeMatch: prefix }
          # Cercle Gardien: validation, publication, and every volunteer tool.
          - type: sidebar
            visibility: { roles: [gardien, admin] }
            rail: { below: md }
            props:
              aria-label: Navigation du Cercle Gardien
              className: *sidebarClassName
            classes: *sidebarClasses
            groups:
              - label: Cercle Gardien
                items:
                  - { label: Bénévoles, href: /espace/coordination/membres, icon: user-check }
                  - { label: Ateliers à valider, href: /espace/validation, icon: inbox, activeMatch: prefix }
                  - { label: Ateliers en ligne, href: /espace/ateliers, icon: calendar-check, activeMatch: prefix }
                  - { label: Agenda à gérer, href: /espace/coordination/agenda, icon: calendar-cog }
                  - { label: Actualités à publier, href: /espace/coordination/actualites, icon: megaphone }
                  - { label: Suivi des ateliers, href: /espace/suivi, icon: clipboard-check, activeMatch: prefix }
                  - { label: Proposer une date, href: /espace/proposer, icon: calendar-plus }
      - type: container
        props:
          id: contenu
          className: min-w-0 flex-1 px-4 py-6 sm:px-10 sm:py-8
        children: $children
