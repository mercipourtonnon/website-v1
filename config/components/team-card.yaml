# Team flip card — flips on hover AND on keyboard focus: the back face is
# focusable (tabindex 0), so Tab lands on the bio, flips the card through
# :focus-within (CSS in /assets/site.css) and lets arrow keys scroll it.
# Vars: $photo (/pictures/x.jpg), $alt, $name (lowercase display), $role,
# $bio, $photoBg (bg-orange-light), $backBg (bg-mauve), $roleAccent
# (text-mauve). Full class tokens only.
name: team-card
type: container
element: article
props:
  className: team-card h-[26rem] perspective-1000 cursor-pointer
children:
  - type: container
    props:
      className: team-card-inner relative w-full h-full transition-transform duration-500 preserve-3d
    children:
      # Front
      - type: container
        props:
          className: team-card-front absolute w-full h-full backface-hidden bg-white rounded-card shadow-card overflow-hidden flex flex-col
        children:
          - type: container
            props:
              className: flex-1 flex items-center justify-center $photoBg
            children:
              - type: image
                props:
                  src: $photo
                  alt: $alt
                  loading: lazy
                  className: w-44 h-44 rounded-pill object-cover border-4 border-white shadow-card
          - type: container
            props:
              className: p-5 text-center flex flex-col gap-1
            children:
              - type: text
                element: h3
                props:
                  className: type-h4 text-bleu-fonce
                content: $name
              - type: text
                element: p
                props:
                  className: $roleAccent type-small font-bold
                content: $role
      # Back
      - type: container
        props:
          className: team-card-back absolute w-full h-full backface-hidden $backBg text-white rounded-card p-6 overflow-y-auto rotate-y-180
          tabindex: '0'
          aria-label: Présentation de $alt
        children:
          - type: text
            element: p
            props:
              className: title-font type-h4 mb-1 text-white
              aria-hidden: 'true'
            content: $name
          - type: text
            element: p
            props:
              className: type-caption font-bold mb-4 text-white
            content: $role
          - type: text
            element: p
            props:
              className: type-small text-white
            content: $bio
