# "Pour qui" card — vars: $icon (lucide name), $iconBg (bg-pourpre-light),
# $accent (text-pourpre — icon colour only), $title, $text. Full class tokens.
name: audience-card
type: container
props:
  className: bg-white rounded-card border border-bleu-fonce-light p-6 flex flex-col gap-3 h-full
children:
  - type: container
    props:
      className: w-12 h-12 rounded-pill flex items-center justify-center $iconBg
    children:
      - type: icon
        props:
          name: $icon
          size: 24
          strokeWidth: 2
          className: $accent
  - type: text
    element: h3
    props:
      className: type-h4 text-bleu-fonce
    content: $title
  - type: text
    element: p
    props:
      className: type-small text-bleu-fonce-70
    content: $text
