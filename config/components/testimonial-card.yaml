# Testimonial card — one instance per testimonial, laid out in CSS columns
# (.testimonial-card: break-inside avoid). Vars: $quote (verbatim, without
# surrounding quote marks — the pourpre quote glyph carries them), $author
# ("Leyla" or "Anonyme"), $size (full class token: type-body, or type-lead for
# the featured quotes).
name: testimonial-card
type: container
element: div
props:
  className: testimonial-card bg-white rounded-card shadow-card border border-pourpre-lighter p-6 sm:p-8 flex flex-col gap-4
children:
  - type: icon
    props: { name: quote, size: 32, strokeWidth: 2, className: text-pourpre }
  - type: text
    element: blockquote
    props:
      className: $size text-bleu-fonce
    content: $quote
  - type: text
    element: p
    props:
      className: type-caption font-bold text-pourpre-hover
    content: — $author
