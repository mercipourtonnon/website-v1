                          className: w-full h-auto rounded-media shadow-card object-cover aspect-[4/5]
              # 3 piliers
              - type: container
                props:
                  className: grid md:grid-cols-3 gap-6
                children:
                  - type: container
                    props: { className: bg-white rounded-card shadow-card p-6 flex flex-col gap-3 }
                    children:
                      - type: icon
                        props: { name: target, size: 28, strokeWidth: 2, className: text-orange-ink }
                      - type: text
                        element: h3
                        props: { className: type-h4 text-bleu-fonce }
                        content: apprendre à dire non
                      - type: text
                        element: p
                        props: { className: type-small text-bleu-fonce-70 }
                        content: Écouter ses ressentis, poser ses limites et accueillir le "non" de l'autre avec bienveillance
                  - type: container
                    props: { className: bg-white rounded-card shadow-card p-6 flex flex-col gap-3 }
                    children:
                      - type: icon
                        props: { name: globe, size: 28, strokeWidth: 2, className: text-orange-ink }
                      - type: text
                        element: h3
                        props: { className: type-h4 text-bleu-fonce }
                        content: pour tous les contextes
                      - type: text
                        element: p
                        props: { className: type-small text-bleu-fonce-70 }
                        content: Relations amicales, familiales, professionnelles, intimes — le consentement est partout
                  - type: container
                    props: { className: bg-white rounded-card shadow-card p-6 flex flex-col gap-3 }
                    children:
                      - type: icon
                        props: { name: shield, size: 28, strokeWidth: 2, className: text-orange-ink }
                      - type: text
                        element: h3
                        props: { className: type-h4 text-bleu-fonce }
                        content: un enjeu collectif
                      - type: text
                        element: p
                        props: { className: type-small text-bleu-fonce-70 }
                        content: Issu des luttes féministes, le consentement questionne les rapports de pouvoir dans la société
              # Notre approche + Pourquoi nous faire confiance
              - type: container
                props:
                  className: grid lg:grid-cols-2 gap-6
                children:
                  - type: container
                    props:
                      className: bg-white rounded-card shadow-card p-8 flex flex-col gap-6
                    children:
                      - type: text
                        element: h3
                        props: { className: type-h4 text-bleu-fonce }
                        content: notre approche
                      - type: container
                        props: { className: flex flex-col gap-2 }
                        children:
                          - type: text
                            element: h4
                            props: { className: font-bold text-bleu-fonce }
                            content: Association à but non lucratif
                          - type: text
                            element: p
                            props: { className: type-small text-bleu-fonce-70 }
                            children:
                              - type: text
                                element: span
                                content: 'Nos ateliers sont à '
                              - type: text
                                element: span
                                props: { className: font-bold text-bleu-fonce }
                                content: prix libre
                              - type: text
                                element: span
                                content: ' — personne n''est refusé·e par manque d''argent. On croit que le consentement doit être '
                              - type: text
                                element: span
                                props: { className: font-bold text-bleu-fonce }
                                content: accessible
                              - type: text
                                element: span
                                content: ' à tou·te·s.'
                      - type: container
                        props: { className: flex flex-col gap-2 }
                        children:
                          - type: text
                            element: h4
                            props: { className: font-bold text-bleu-fonce }
                            content: Inclusif et accessible
                          - type: text
                            element: p
                            props: { className: type-small text-bleu-fonce-70 }
                            children:
                              - type: text
                                element: span
                                content: 'On accueille tous les publics dans leur '
                              - type: text
                                element: span
                                props: { className: font-bold text-bleu-fonce }
                                content: diversité
                              - type: text
                                element: span
                                content: '. Nos espaces sont '
                              - type: text
                                element: span
                                props: { className: font-bold text-bleu-fonce }
                                content: bienveillants
                              - type: text
                                element: span
                                content: ' et adaptés aux différents vécus et capacités.'
                  - type: container
                    props:
                      className: bg-white rounded-card shadow-card p-8 flex flex-col gap-6
                    children:
                      - type: text
                        element: h3
                        props: { className: type-h4 text-bleu-fonce }
                        content: pourquoi nous faire confiance ?
                      - type: container
