                        content: 'Association à but non lucratif, on garde nos ateliers '
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: gratuits
                      - type: text
                        element: span
                        content: ' — un don libre soutient l''association, et personne n''est refusé·e par manque d''argent. On croit que le consentement doit être '
