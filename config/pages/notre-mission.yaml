                          - type: text
                            element: span
                            content: ' où chacun·e peut apprendre à '
                          - type: text
                            element: span
                            props: { className: font-bold text-orange-ink }
                            content: dire non
                          - type: text
                            element: span
                            content: ', '
                          - type: text
                            element: span
                            props: { className: font-bold text-orange-ink }
                            content: poser ses limites
                          - type: text
                            element: span
                            content: ' et construire des '
                          - type: text
                            element: span
                            props: { className: font-bold text-pourpre-hover }
                            content: relations plus authentiques
                          - type: text
                            element: span
                            content: ' — dans tous les contextes de vie.'
                  - type: container
                    props:
                      className: lg:col-span-5 photo-frame frame-orange max-w-md lg:max-w-none
                    children:
                      - type: image
