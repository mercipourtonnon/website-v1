                        props: { className: type-h4 text-bleu-fonce }
                        content: pour tous les contextes
                      - type: text
                        element: p
                        props: { className: type-small text-bleu-fonce-70 }
                        content: Relations amicales, familiales, professionnelles, intimes — le consentement est partout
                  - type: container
