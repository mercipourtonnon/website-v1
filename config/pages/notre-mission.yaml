                        props: { role: listitem, className: relative pl-14 pb-8 border-l-2 border-bleu-fonce-light ml-5 }
                        children:
                          - type: text
                            element: span
                            props: { className: absolute -left-5 top-0 w-10 h-10 rounded-pill bg-orange text-bleu-fonce font-bold flex items-center justify-center, aria-hidden: 'true' }
                            content: '2'
                          - type: text
                            element: p
                            props: { className: type-overline text-orange-ink pt-2.5 }
                            content: nov. 2025
                          - type: text
                            element: h3
                            props: { className: type-h4 text-bleu-fonce mb-1 }
                            content: des ateliers chaque mois
                          - type: text
                            element: p
                            props: { className: type-small text-bleu-fonce-70 }
                            content: Le rythme mensuel s'installe, à La Plage Digitale.
                      - type: container
                        element: div
                        props: { role: listitem, className: relative pl-14 pb-8 border-l-2 border-bleu-fonce-light ml-5 }
                        children:
                          - type: text
                            element: span
                            props: { className: absolute -left-5 top-0 w-10 h-10 rounded-pill bg-orange text-bleu-fonce font-bold flex items-center justify-center, aria-hidden: 'true' }
                            content: '3'
                          - type: text
                            element: p
                            props: { className: type-overline text-orange-ink pt-2.5 }
                            content: févr.–mars 2026
                          - type: text
                            element: h3
