      # Section: Pourquoi c'est important (#pourquoi) — the social need, sourced
      # (BPS 1.1–1.6). Pourpre: the emotional register of the figures.
      - type: container
        element: section
        props:
          id: pourquoi
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-12
            children:
              - type: container
                props:
                  className: lg:col-span-5 flex flex-col gap-6 lg:sticky lg:top-28 self-start
                children:
