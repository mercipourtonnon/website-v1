                    content: Partenaires
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: ils nous soutiennent
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: Deux lieux strasbourgeois qui accompagnent l'association.
              - type: container
                props:
                  className: lg:col-span-8 grid sm:grid-cols-2 gap-6
                children:
                  - component: partner-card
                    vars:
                      logo: /partners/le-labo-des-partenariats.svg
                      tileBg: bg-white
                      name: Le Labo des Partenariats
                      text: Tiers-lieu et incubateur d'innovation sociale de l'Eurométropole de Strasbourg.
                      href: https://lelabo-partenariats.org
                      linkLabel: Découvrir Le Labo des Partenariats
                  - component: partner-card
                    vars:
                      logo: /partners/la-plage-digitale-blanc.webp
                      tileBg: tile-bleu-fonce
                      name: La Plage Digitale
                      text: Tiers-lieu de l'innovation et espace de coworking associatif à Strasbourg.
                      href: https://www.laplagedigitale.fr
                      linkLabel: Découvrir La Plage Digitale

      # Section: Agir avec nous (#agir) — the two ways in: bénévolat and don
      - type: container
        element: section
        props:
          id: agir
          className: px-4 sm:px-6 pb-band-sm md:pb-band
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto bg-orange-light rounded-media p-8 md:p-12 grid md:grid-cols-12 gap-8 items-center
            children:
              - type: container
                props:
                  className: md:col-span-7 flex flex-col gap-4
                children:
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: agir avec nous
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce
                    content: Rejoins l'équipe bénévole pour tenir un stand, accueillir un atelier ou faire connaître l'association. Tu peux aussi nous soutenir par un don, pour que nos ateliers restent à prix libre.
              - type: container
                props:
                  className: md:col-span-5 flex flex-col sm:flex-row md:flex-col lg:flex-row gap-3 md:items-end lg:justify-end
                children:
                  - type: link
                    props:
                      href: /inscription
                      className: inline-flex items-center justify-center gap-2 whitespace-nowrap bg-mauve text-white px-6 py-3 rounded-pill font-bold hover:bg-mauve-hover transition-colors
                    children:
                      - type: text
                        element: span
                        content: Devenir bénévole
                      - type: icon
                        props: { name: arrow-right, size: 20, strokeWidth: 2 }
                  # TODO(don): HelloAsso URL — the organisation page stands in until the
                  # donation form exists. Same URL in site-header, site-footer, notre-mission.
                  - type: link
                    props:
                      href: https://www.helloasso.com/associations/merci-pour-ton-non
                      target: _blank
