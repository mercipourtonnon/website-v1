# /notre-mission — who we are: mission and approach, our vision of consent
# (teaser of /le-consentement), values, l'équipe cœur, partners, and the two
# ways to act with us. Split out of the one-page home (review of 2026-10-09);
# section ids are the home's old anchors (#mission, #valeurs, #equipe,
# #partenaires).
name: notre-mission
path: /notre-mission
sitemap:
  priority: 0.7
  changefreq: monthly
meta:
  lang: fr-FR
  title: "Notre mission et l'équipe - Merci pour ton non"
  description: "Merci pour ton non diffuse une culture du consentement à Strasbourg et dans le Grand Est : notre mission, nos valeurs, l'équipe cœur et nos partenaires."
  author: Merci pour ton non
  robots: index, follow
  canonical: https://mercipourtonnon.fr/notre-mission
  openGraph:
    type: website
    title: "Notre mission | Merci pour ton non"
    description: "Diffuser une culture du consentement à Strasbourg et dans le Grand Est : notre mission, nos valeurs et l'équipe cœur."
    url: https://mercipourtonnon.fr/notre-mission
    image: https://mercipourtonnon.fr/social.png
    imageAlt: "Merci pour ton non — notre mission"
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: "Notre mission | Merci pour ton non"
    description: "Diffuser une culture du consentement à Strasbourg et dans le Grand Est : notre mission, nos valeurs et l'équipe cœur."
    image: https://mercipourtonnon.fr/social.png
  schema:
    '@context': https://schema.org
    '@type': AboutPage
    name: Notre mission
    url: https://mercipourtonnon.fr/notre-mission
    inLanguage: fr-FR
    about:
      '@type': Organization
      name: Merci pour ton non
      url: https://mercipourtonnon.fr
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
      - size: 32x32
        href: /favicon/favicon-32x32.png
      - size: 16x16
        href: /favicon/favicon-16x16.png
  preload:
    - href: /fonts/NeueMachina/NeueMachina-Regular.otf
      as: font
      type: font/otf
      crossorigin: anonymous
    - href: /fonts/BelyDisplay/BelyDisplay-Regular.woff2
      as: font
      type: font/woff2
      crossorigin: anonymous
  customElements:
    - type: meta
      attrs:
        name: theme-color
        content: '#FFAF00'
    - type: link
      attrs:
        rel: manifest
        href: /favicon/site.webmanifest

scripts:
  externalScripts:
    # Mobile menu close-on-link / Escape, current page, FAQ aria (site.js)
    - src: /assets/site.js
      defer: true
      position: body-end

