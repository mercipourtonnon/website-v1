# /notre-mission — the association, told from the Business Plan Social (review
# of 2026-10-09): mission (#mission), anchor nav, figures (#chiffres), the
# social need with the link to /le-consentement (#pourquoi), our story and
# timeline (#histoire), values (#valeurs), l'équipe cœur (#equipe), the
# bénévoles (#benevoles, one paragraph), governance (#fonctionnement), partners
# (#partenaires), four ways in (#agir, how to contribute included) and what
# comes next (#ensuite, the one detailed roadmap; /vos-idees links here).
# Dates after today are marked « à venir » / « prévu ».
# Section ids #mission, #valeurs, #equipe, #partenaires are the home's old
# anchors; /nos-interventions links to #chiffres.
name: notre-mission
path: /notre-mission
sitemap:
  priority: 0.7
  changefreq: monthly
meta:
  lang: fr-FR
  title: "Notre mission et l'équipe - Merci pour ton non"
  description: "Merci pour ton non diffuse une culture du consentement à Strasbourg et en Alsace : chiffres, histoire, valeurs, équipe, bénévoles, gouvernance et partenaires."
  author: Merci pour ton non
  noindex: true # PRE-LAUNCH: remove at launch
  robots: index, follow
  canonical: https://mercipourtonnon.fr/notre-mission
  openGraph:
    type: website
    title: "Notre mission | Merci pour ton non"
    description: "Diffuser une culture du consentement à Strasbourg et en Alsace : nos chiffres, notre histoire, nos valeurs, l'équipe et les bénévoles."
    url: https://mercipourtonnon.fr/notre-mission
    image: https://mercipourtonnon.fr/social.png
    imageAlt: "Merci pour ton non — notre mission"
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: "Notre mission | Merci pour ton non"
    description: "Diffuser une culture du consentement à Strasbourg et en Alsace : nos chiffres, notre histoire, nos valeurs, l'équipe et les bénévoles."
    image: https://mercipourtonnon.fr/social.png
  schema:
    '@context': https://schema.org
    '@type': AboutPage
    name: Notre mission
    url: https://mercipourtonnon.fr/notre-mission
    inLanguage: fr-FR
    about:
      '@type': Organization
      name: Merci pour ton non
      url: https://mercipourtonnon.fr
      foundingDate: '2025-09-21'
      areaServed: Alsace
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
      - size: 32x32
        href: /favicon/favicon-32x32.png
      - size: 16x16
        href: /favicon/favicon-16x16.png
  preload:
    - href: /fonts/NeueMachina/NeueMachina-Regular.otf
      as: font
      type: font/otf
      crossorigin: anonymous
    - href: /fonts/BelyDisplay/BelyDisplay-Regular.woff2
      as: font
      type: font/woff2
      crossorigin: anonymous
  customElements:
    - type: meta
      attrs:
        name: theme-color
        content: '#FFAF00'
    - type: link
      attrs:
        rel: manifest
        href: /favicon/site.webmanifest

scripts:
