                            props: { className: type-caption text-bleu-fonce-70 }
                            content: "Source : CESE, 2024."
                  - type: container
                    element: div
                    props: { role: listitem, className: 'grid grid-cols-[6rem_1fr] sm:grid-cols-[8rem_1fr] gap-4 py-5 border-t-2 border-pourpre-lighter' }
