                    vars:
                      icon: search
                      accent: text-mauve
                      title: esprit critique
                      text: On examine nos croyances, nos automatismes, nos biais et nos privilèges — avec de la réflexivité et du doute, parce que c'est ce qui permet d'agir plus juste.
                  - component: value-card
                    vars:
                      icon: sparkles
