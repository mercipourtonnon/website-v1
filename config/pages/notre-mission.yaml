                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce
                    content: "Merci pour ton non est née de deux expériences et d'un constat partagé : pour Mathilde, un atelier chez Love Experience où elle a découvert qu'un non peut être joyeux ; pour Thomas, une relation où il a mesuré ce que son manque d'éducation au consentement avait coûté à l'autre."
                  - type: text
                    element: p
                    props:
                      className: text-bleu-fonce-70
                    content: "On a d'abord animé des ateliers informels dans un collectif strasbourgeois. Sept cofondateur·ices se sont retrouvé·es autour d'une conviction : le consentement n'est pas cantonné à la vie affective et sexuelle, il traverse toutes nos relations. L'association est créée le 21 septembre 2025 — et le premier atelier a lieu le même jour."
