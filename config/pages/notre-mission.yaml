                    element: p
                    props:
                      className: type-overline text-pourpre-hover
                    content: Le besoin
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: pourquoi c'est important
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce
                    content: "On apprend à lire, à nager, à conduire. Dire non et entendre un non, personne ne nous l'apprend. Merci pour ton non est la pièce manquante entre les politiques de prévention des violences sexistes et sexuelles et la stratégie nationale des compétences psychosociales : apprendre le consentement avant, comme une compétence relationnelle, pour tout le monde."
