# /espace/arrivee — auth.landingPath. Draws nothing: a signed-in session is
# redirected to its role's defaultLanding (candidat → /espace/en-attente,
# member, coeur, gardien, admin → /espace), and this page's access rule is
# the guard that sends an anonymous visitor to /connexion first
# (auth-access/auth-post-login, auth-access/auth-assignments).
name: espace-arrivee
path: /espace/arrivee
access: { require: authenticated, redirectTo: /connexion }
sitemap: false
meta:
  lang: fr-FR
  title: Espace bénévole - Merci pour ton non
  noindex: true
  robots: noindex, nofollow
  favicon: ./favicon/favicon-32x32.png
components: []
