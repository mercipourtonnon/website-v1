# /connexion — sign-in for the Espace bénévole.
# Adapted from library block/auth-sign-in@0.33.0 (French, brand tokens).
# After sign-in, `role-landing` sends the session to auth.landingPath
# (/espace/arrivee), which redirects to its role's defaultLanding: a candidat
# to /espace/en-attente, everyone else to /espace. The sign-up link is gated on
# auth.signUp, so it disappears if sign-up is closed again.
name: espace-connexion
path: /connexion
sitemap: false
meta:
  lang: fr-FR
  title: Connexion - Espace bénévole
  description: Connexion à l'espace bénévole de Merci pour ton non.
  noindex: true
  robots: noindex, nofollow
  favicon: ./favicon/favicon-32x32.png
components:
  # The page frame already provides the <main> landmark.
  - type: container
    props:
      className: flex min-h-screen justify-center bg-orange-lighter px-4 pt-10 pb-12 sm:items-center sm:px-6
    children:
      - type: container
        props:
          className: flex w-full max-w-md flex-col gap-6 self-start sm:self-auto sm:rounded-lg sm:border sm:border-mauve-lighter sm:bg-white sm:p-8
        children:
          - type: link
            props:
              href: /
              className: self-start
            children:
              - type: image
                props:
                  src: /logo-without-marging.svg
                  alt: Merci pour ton non, retour au site
                  className: h-12 w-auto
          - type: flex
            props:
              className: flex flex-col gap-2
            children:
              - type: text
                element: h1
                props:
                  className: text-3xl title-font text-bleu-fonce
                content: espace bénévole
              - type: text
                element: p
                props:
                  className: text-bleu-fonce
                content: Connecte-toi pour retrouver l'agenda de l'équipe, les actualités de l'asso et les autres bénévoles.
          - type: form
            action:
              type: auth
              method: login
              strategy: email
              submitLabel: Me connecter
              pendingLabel: Connexion…
              fields:
                - { name: email, label: Adresse email, placeholder: toi@exemple.fr }
                - { name: password, label: Mot de passe }
              onSuccess: { type: role-landing }
          - type: link
            props:
              href: /reset-password
              className: self-start text-sm text-bleu-fonce underline underline-offset-4
            content: Mot de passe oublié ?
            visibility:
              declares: auth.passwordReset
          - type: container
            visibility:
              declares: auth.signUp
            props:
              className: flex flex-wrap gap-1 border-t border-mauve-lighter pt-4 text-sm text-bleu-fonce
            children:
              - { type: text, element: span, content: Pas encore de compte ? }
              - type: link
                props:
                  href: /inscription
                  className: font-bold text-bleu-fonce underline decoration-orange decoration-2 underline-offset-4 hover:text-mauve
                content: Rejoindre l'équipe bénévole
