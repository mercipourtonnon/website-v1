# /connexion — sign-in for the Espace facilitateur·ices.
# Adapted from library block/auth-sign-in@0.33.0 (French, brand tokens).
# No sign-up link: accounts are created by invitation (auth.allowSignUp: false),
# and the block's alternatives are gated on what auth declares.
name: espace-connexion
path: /connexion
sitemap: false
meta:
  lang: fr-FR
  title: Connexion - Espace facilitateur·ices
  description: Connexion à l'espace des facilitateur·ices de Merci pour ton non.
  noindex: true
  robots: noindex, nofollow
  favicon: ./favicon/favicon-32x32.png
components:
  # The page frame already provides the <main> landmark.
  - type: container
    props:
      className: flex min-h-screen justify-center bg-orange-lighter px-4 pt-10 pb-12 sm:items-center sm:px-6
    children:
      - type: container
        props:
          className: flex w-full max-w-md flex-col gap-6 self-start sm:self-auto sm:rounded-lg sm:border sm:border-gray-200 sm:bg-white sm:p-8
        children:
          - type: link
            props:
              href: /
              className: self-start
            children:
              - type: image
                props:
                  src: /logo-without-marging.svg
                  alt: Merci pour ton non, retour au site
                  className: h-12 w-auto
          - type: flex
            props:
              className: flex flex-col gap-2
            children:
              - type: text
                element: h1
                props:
                  className: text-3xl title-font text-bleu-fonce
                content: espace facilitateur·ices
              - type: text
                element: p
                props:
                  className: text-bleu-fonce
                content: Connecte-toi avec l'adresse email de ton invitation pour proposer des dates d'atelier et suivre tes propositions.
          - type: form
            action:
              type: auth
              method: login
              strategy: email
              submitLabel: Me connecter
              pendingLabel: Connexion…
              fields:
                - { name: email, label: Adresse email, placeholder: toi@exemple.fr }
                - { name: password, label: Mot de passe }
              onSuccess: { navigate: /espace }
          - type: link
            props:
              href: /reset-password
              className: self-start text-sm text-bleu-fonce underline underline-offset-4
            content: Mot de passe oublié ?
            visibility:
              declares: auth.passwordReset
          - type: text
            element: p
            props:
              className: border-t border-gray-200 pt-4 text-sm text-gray-700
            content: Pas encore de compte ? L'espace est réservé aux personnes qui animent nos ateliers. Écris-nous à mercipourtonnon@gmail.com pour recevoir une invitation.
