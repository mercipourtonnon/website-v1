                    element: p
                    props:
                      className: type-overline text-pourpre-hover
                    content: Témoignages
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: ce que les participant·es en disent
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: Des personnes qui sont venues, et qui en parlent mieux que nous.
              - type: container
                props:
                  className: grid lg:grid-cols-3 gap-6 items-start
                children:
                  - component: testimonial-card
                    vars:
                      size: type-lead
                      quote: "C'est la première fois que je participais à un atelier autour de la notion de consentement, et première fois tout court que je participais à un atelier militant, et ce fût une très belle première fois ! […] je me suis sentie en sécurité et à l'aise pour participer facilement. Le contenu en lui-même a été très intéressant et m'a apporté des notions nouvelles alors que je pensais déjà être assez calée sur le sujet. Les exercices pratiques sont un vrai plus ! […]"
                      author: Leyla
                  - component: testimonial-card
                    vars:
                      size: type-lead
                      quote: "En tant qu'homme cis, je craignais que la question du consentement ne soit abordée que par le prisme des violences sexistes, dans lesquelles les hommes sont très majoritairement mis en cause. Mais l'angle de l'atelier était bien plus large que ça, et mettait en lumière le fait que poser ses limites, et dépasser les limites d'autrui, était sans rapport avec les questions de genre."
                      author: Pierre
                  - component: testimonial-card
                    vars:
                      size: type-lead
                      quote: "Une très belle expérience à partager! Venu en couple, j'avais un peu d'appréhension à l'idée de parler de moi ou de nous. La force de l'atelier est d'approcher le consentement avec des exemples simples, progressifs et du quotidien : \"tu me prêtes ton crayon? ...\". Une prise de recul qui permet d'approcher la notion de manière sereine. Merci beaucoup."
                      author: Nicolas
              - type: link
