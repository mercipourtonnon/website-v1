    organization:
      '@context': https://schema.org
      '@type': Organization
      name: Merci pour ton non
      description: Organisation d'ateliers de consentement gratuits à Strasbourg — don libre pour soutenir l'association. Formation pratique pour apprendre à dire non et développer des relations saines.
      url: https://mercipourtonnon.fr
      logo: https://mercipourtonnon.fr/logo.svg
      sameAs:
        - https://www.instagram.com/mercipourtonnon/
        - https://www.facebook.com/mercipourtonnon
        - https://www.linkedin.com/company/merci-pour-ton-non
      address:
        '@type': PostalAddress
        addressLocality: Strasbourg
        addressCountry: FR
      # Workshop dates are not listed here: each date carries its own
    localBusiness:
      '@context': https://schema.org
      '@type': LocalBusiness
      name: Merci pour ton non
      description: Ateliers de consentement gratuits à Strasbourg — don libre pour soutenir l'association. Formation pratique pour apprendre à dire non et développer des relations saines.
      url: https://mercipourtonnon.fr
      logo: https://mercipourtonnon.fr/logo.svg
      email: mercipourtonnon@gmail.com
      priceRange: Gratuit (don libre)
      address:
        '@type': PostalAddress
        addressLocality: Strasbourg
        addressRegion: Alsace
        addressCountry: FR
      geo:
        '@type': GeoCoordinates
        latitude: '48.5734'
        longitude: '7.7521'
      sameAs:
        - https://www.instagram.com/mercipourtonnon/
        - https://www.facebook.com/mercipourtonnon
        - https://www.linkedin.com/company/merci-pour-ton-non
      areaServed:
        '@type': GeoCircle
        geoMidpoint:
          '@type': GeoCoordinates
          latitude: '48.5734'
          longitude: '7.7521'
        geoRadius: '50000'
      serviceType: Atelier de consentement
      # No dated hasOfferCatalog: dates live on /ateliers/:slug.

  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
      - size: 32x32
        href: /favicon/favicon-32x32.png
      - size: 16x16
        href: /favicon/favicon-16x16.png

  preload:
    - href: /fonts/NeueMachina/NeueMachina-Regular.otf
      as: font
      type: font/otf
      crossorigin: anonymous
    - href: /fonts/BelyDisplay/BelyDisplay-Regular.woff2
      as: font
      type: font/woff2
      crossorigin: anonymous

  dnsPrefetch:
    - https://sibforms.com

  customElements:
    - type: link
      attrs:
        rel: stylesheet
        href: https://sibforms.com/forms/end-form/build/sib-styles.css
    - type: meta
      attrs:
        name: theme-color
        content: '#FFAF00'
    - type: meta
      attrs:
        name: msapplication-navbutton-color
        content: '#FFAF00'
    - type: meta
      attrs:
        name: apple-mobile-web-app-status-bar-style
        content: '#FFAF00'
    - type: meta
      attrs:
        property: og:image:width
        content: '1200'
    - type: meta
      attrs:
        property: og:image:height
        content: '630'
    - type: meta
      attrs:
        property: article:author
        content: Merci pour ton non
    - type: meta
      attrs:
        property: article:publisher
        content: https://mercipourtonnon.fr
    - type: link
      attrs:
        rel: manifest
        href: /favicon/site.webmanifest

scripts:
  inlineScripts:
    # Brevo form configuration — verbatim from index.html
    - position: body-end
      code: |
        window.REQUIRED_CODE_ERROR_MESSAGE = 'Veuillez choisir un code pays';
        window.LOCALE = 'fr';
        window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = "Les informations fournies ne sont pas valides.";
        window.REQUIRED_ERROR_MESSAGE = "Ce champ est requis.";
        window.GENERIC_INVALID_MESSAGE = "Les informations fournies ne sont pas valides.";
        window.translation = { common: { selectedList: '{quantity} liste sélectionnée', selectedLists: '{quantity} listes sélectionnées' } };
        var AUTOHIDE = Boolean(0);
  externalScripts:
    # Site behaviors: mobile-menu close, current page
    - src: /assets/site.js
      defer: true
      position: body-end
    # Injectors must run (defer, document order) before the vendor scripts scan the DOM
    - src: /assets/brevo-embed.js
      defer: true
      position: body-end
    - src: https://sibforms.com/forms/end-form/build/main.js
      defer: true
      position: body-end

components:
  - component: site-header

  # Sovrium already wraps the page in <main id="main-content">; this div is
  # the skip-link target past the header.
  - type: container
    props:
      id: contenu
      className: bg-white overflow-x-clip
    children:
      # Section: Hero
      - type: container
        element: section
        props:
          className: px-4 sm:px-6 pt-10 md:pt-16 pb-band-sm md:pb-band
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-12 items-center
            children:
              - type: container
                props:
                  className: lg:col-span-6 flex flex-col gap-6
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-mauve
                    content: Ateliers gratuits · Strasbourg et Alsace
                  # Brand-coloured title, as in the logo. "de sensibilisation" is
                  # bleu foncé: orange text fails contrast even at display size (1.8:1).
                  # type-page, not type-hero: the longer title (F1) overflows the
                  # half-width column at display size.
                  - type: text
                    element: h1
                    props:
                      className: type-page
                    children:
                      - type: text
                        element: span
                        props:
                          className: title-font text-pourpre
                        content: 'ateliers '
                      - type: text
                        element: span
                        props:
                          className: title-font text-bleu-fonce
                        content: 'de sensibilisation '
                      - type: text
                        element: span
                        props:
                          className: title-font text-mauve block
                        content: 'et de consentement '
                      - type: text
                        element: span
                        props:
                          className: title-font text-cyan block
                        content: à strasbourg
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70 max-w-xl
                    content: "Ateliers, stands et interventions : on t'invite à apprendre à dire non, à poser tes limites et à accueillir celles des autres."
                  # Key facts — one row, icons in one accent
                  - type: container
                    element: div
                    props:
                      role: list
                      className: flex flex-wrap gap-x-6 gap-y-2 type-small font-bold text-bleu-fonce
                    children:
                      - type: container
                        element: div
                        props: { role: listitem, className: inline-flex items-center gap-2 }
                        children:
                          - type: icon
                            props: { name: users, size: 18, strokeWidth: 2, className: text-mauve }
                          - type: text
                            element: span
                            content: 6 à 15 personnes
                      - type: container
                        element: div
                        props: { role: listitem, className: inline-flex items-center gap-2 }
                        children:
                          - type: icon
                            props: { name: clock, size: 18, strokeWidth: 2, className: text-mauve }
                          - type: text
                            element: span
                            content: 3 heures
                      - type: container
                        element: div
                        props: { role: listitem, className: inline-flex items-center gap-2 }
                        children:
                          - type: icon
                            props: { name: heart, size: 18, strokeWidth: 2, className: text-mauve }
                          - type: text
                            element: span
                            content: Gratuit, don libre
                      - type: container
                        element: div
                        props: { role: listitem, className: inline-flex items-center gap-2 }
                        children:
                          - type: icon
                            props: { name: map-pin, size: 18, strokeWidth: 2, className: text-mauve }
                          - type: text
                            element: span
                            content: Strasbourg, Alsace
                  # CTA
                  - type: container
                    props:
                      className: flex flex-col sm:flex-row sm:items-center gap-4 pt-2
                    children:
                      - type: link
                        props:
                          href: /nos-ateliers#events
                          className: inline-flex items-center justify-center gap-2 self-start whitespace-nowrap bg-orange text-bleu-fonce px-7 py-4 rounded-pill font-bold type-lead hover:bg-orange-hover transition-colors shadow-card
                        children:
                          - type: text
                            element: span
                            content: Je réserve ma place
                          - type: icon
                            props: { name: arrow-right, size: 20, strokeWidth: 2 }
                      # Next date, server-rendered from `workshops` (limit 1). A `list`
                      # drawn from `children` is rendered on the server (a gallery
                      # hydrates in the browser, so its date would not be in the HTML).
                      - type: list
                        props:
                          id: hero-next-date
                          aria-label: Prochaine session
                          className: list-none p-0 m-0 type-small text-bleu-fonce-70
                        dataSource:
                          table: workshops
                          filter:
                            - { field: status, operator: eq, value: published }
                            - { field: session_date, operator: gte, value: $today }
                          sort: [{ field: starts_at, direction: asc }]
                          limit: 1
                        listDisplay:
                          emptyMessage: Nouvelles dates bientôt
                        children:
                          - type: text
                            element: p
                            props:
                              className: type-small text-bleu-fonce-70
                            children:
                              - type: text
                                element: span
                                content: 'Prochaine session le '
                              - type: text
                                element: span
                                props:
                                  className: font-bold text-bleu-fonce
                                content: $record.date_label à $record.time_label
              - type: container
                props:
                  className: lg:col-span-6 photo-frame frame-mauve
                children:
                  - type: image
                    variant: hero
                    props:
                      src: /pictures/atelier/dilara-mathilde-rires.webp
                      srcset: /pictures/atelier/dilara-mathilde-rires-sm.webp 800w, /pictures/atelier/dilara-mathilde-rires.webp 1600w
                      sizes: '(min-width: 1024px) 600px, 100vw'
                      alt: Dilara et Mathilde, facilitatrices, rient ensemble pendant un atelier de consentement
                      className: w-full h-auto rounded-media shadow-raised object-cover aspect-[3/2]

      # Section: En chiffres (#chiffres) — the four figures of /notre-mission#chiffres.
      # Constantes tenues à la main — source BPS 1.10 (état au 9 octobre 2026).
      # Même compteur que le rapport moral : à mettre à jour après chaque atelier.
      # Héritage du build statique (où un kpi restait vide) : hébergé par le
      # serveur, un kpi lié à workshops rendrait désormais les données en direct
      # — à envisager (suivi). Change both pages.
      - type: container
        element: section
        props:
          id: chiffres
          className: px-4 sm:px-6 py-band-sm bg-cyan-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-8 items-center
            children:
              - type: container
                element: div
                props:
                  role: list
                  className: lg:col-span-9 grid grid-cols-2 md:grid-cols-4 gap-4
                  aria-label: L'association en chiffres
                children:
                  - component: figure-tile
                    vars: { value: '12', label: ateliers Niveau 1, accent: text-cyan-ink }
                  - component: figure-tile
                    vars: { value: '108', label: inscriptions, accent: text-mauve }
                  - component: figure-tile
                    vars: { value: '9,25 / 10', label: 'note moyenne, 16 questionnaires', accent: text-pourpre-hover }
                  - component: figure-tile
                    vars: { value: sept. 2025, label: 'premier atelier, le jour de la création', accent: text-orange-ink }
              - type: container
                props:
                  className: lg:col-span-3 flex lg:justify-end
                children:
                  - type: link
                    props:
                      href: /notre-mission#chiffres
                      className: font-bold text-bleu-fonce underline decoration-cyan decoration-2 underline-offset-4 hover:text-cyan-ink
                    content: Voir les chiffres et le pourquoi →

      # Section: Tu es… (#tu-es) — one door per visitor, in the « cet atelier
      # est pour toi si… » voice. Five doors: ateliers, ressources, interventions,
      # stands, chiffres (the old « nos actions » row is folded in here).
      - type: container
        element: section
        props:
          id: tu-es
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4 max-w-2xl
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-orange-ink
                    content: Par où commencer
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: tu es…
              - type: container
                props:
                  className: grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6
                children:
                  - component: door-card
                    vars:
                      href: /nos-ateliers
                      target: _self
                      icon: circle-help
                      iconBg: bg-orange-light
                      accent: text-orange-ink
                      title: une personne curieuse
                      text: "Tu veux t'entraîner à dire non, à l'entendre, à changer d'avis — sans qu'on te demande de raconter ta vie. L'atelier est pour toi."
                      cta: Voir les ateliers
                  - component: door-card
                    vars:
                      href: /ressources#enfants-et-parents
                      target: _self
                      icon: users
                      iconBg: bg-mauve-light
                      accent: text-mauve
                      title: un parent
                      text: "Tu cherches comment en parler avec tes enfants. On a réuni des livres et des outils pour vous — et l'atelier est aussi pour toi, voir « pour qui » sur /nos-ateliers."
                      cta: Voir les ressources
                  - component: door-card
                    vars:
                      href: /nos-interventions
                      target: _self
                      icon: building-2
                      iconBg: bg-cyan-light
                      accent: text-cyan-ink
                      title: une structure ou une entreprise
                      text: "Une équipe, un établissement, une association : on construit avec toi une intervention d'une demi-journée ou d'une journée. Les participant·es ne paient jamais."
                      cta: Voir les interventions
                  - component: door-card
                    vars:
                      href: /nos-stands
                      target: _self
                      icon: messages-square
                      iconBg: bg-cyan-light
                      accent: text-cyan-ink
                      title: un festival ou un événement
                      text: "Tu organises un festival, un forum, une soirée : on vient avec un stand et nos cartes de mises en situation pour ouvrir la discussion."
                      cta: Voir les stands
                  - component: door-card
                    vars:
                      href: /notre-mission#chiffres
                      target: _self
                      icon: newspaper
                      iconBg: bg-pourpre-light
                      accent: text-pourpre-hover
                      title: un·e journaliste ou un financeur
                      text: "Tu veux les chiffres, le besoin social sourcé, l'histoire et la gouvernance de l'association. Tout est sur une page."
                      cta: Voir les chiffres

      # Section: Le consentement, en clair — teaser of /le-consentement
      - type: container
        element: section
        props:
          id: en-clair
          className: px-4 sm:px-6 py-band-sm md:py-band bg-mauve-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-12 items-center
            children:
              - type: container
                props:
                  className: lg:col-span-5 flex flex-col gap-6
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-mauve
                    content: Savoirs
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: le consentement, en clair
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: "Six lettres pour t'en souvenir. On a mis en ligne les notions qu'on partage en atelier : deux définitions, l'acronyme RÈGLES, les biais qui nous poussent à dire oui et quelques phrases pour tenir un non."
                  - type: container
                    props:
                      className: flex flex-wrap items-center gap-4
                    children:
                      - type: link
                        props:
                          href: /le-consentement
                          className: inline-flex items-center gap-2 bg-mauve text-white px-6 py-3 rounded-pill font-bold hover:bg-mauve-hover transition-colors
                        children:
                          - type: text
                            element: span
                            content: Lire les notions
                          - type: icon
                            props: { name: arrow-right, size: 20, strokeWidth: 2 }
                      - type: link
                        props:
                          href: /ressources
                          className: font-bold text-mauve underline underline-offset-4 hover:text-mauve-hover py-2
                        content: Voir les ressources
              - type: container
                element: div
                props:
                  role: list
                  className: lg:col-span-7 grid grid-cols-2 sm:grid-cols-3 gap-4
                  aria-label: L'acronyme RÈGLES
                children:
                  - type: container
                    element: div
                    props: { role: listitem, className: bg-white rounded-card shadow-card p-5 flex flex-col gap-1 }
                    children:
                      - type: text
                        element: span
                        props: { className: title-font normal-case type-h1 text-pourpre, aria-hidden: 'true' }
                        content: R
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: Révocable
                  - type: container
                    element: div
                    props: { role: listitem, className: bg-white rounded-card shadow-card p-5 flex flex-col gap-1 }
                    children:
                      - type: text
                        element: span
                        props: { className: title-font normal-case type-h1 text-mauve, aria-hidden: 'true' }
                        content: È
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: Éclairé
                  - type: container
                    element: div
                    props: { role: listitem, className: bg-white rounded-card shadow-card p-5 flex flex-col gap-1 }
                    children:
                      - type: text
                        element: span
                        props: { className: title-font normal-case type-h1 text-cyan-ink, aria-hidden: 'true' }
                        content: G
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: Gagnant-gagnant
                  - type: container
                    element: div
                    props: { role: listitem, className: bg-white rounded-card shadow-card p-5 flex flex-col gap-1 }
                    children:
                      - type: text
                        element: span
                        props: { className: title-font normal-case type-h1 text-pourpre, aria-hidden: 'true' }
                        content: L
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: Libre
                  - type: container
                    element: div
                    props: { role: listitem, className: bg-white rounded-card shadow-card p-5 flex flex-col gap-1 }
                    children:
                      - type: text
                        element: span
                        props: { className: title-font normal-case type-h1 text-mauve, aria-hidden: 'true' }
                        content: E
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: Explicite
                  - type: container
                    element: div
                    props: { role: listitem, className: bg-white rounded-card shadow-card p-5 flex flex-col gap-1 }
                    children:
                      - type: text
                        element: span
                        props: { className: title-font normal-case type-h1 text-cyan-ink, aria-hidden: 'true' }
                        content: S
                      - type: text
                        element: span
                        props: { className: font-bold text-bleu-fonce }
                        content: Spécifique

      # Section: Testimonials excerpt (#temoignages) — one featured quote; the
      # full wall lives on /nos-ateliers#temoignages.
      - type: container
        element: section
        props:
          id: temoignages
          className: px-4 sm:px-6 py-band-sm md:py-band bg-pourpre-light
        children:
          - type: container
            props:
              className: max-w-3xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-pourpre-hover
                    content: Témoignages
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: ce que les participant·es en disent
              - component: testimonial-card
                vars:
                  size: type-lead
                  quote: "C'est la première fois que je participais à un atelier autour de la notion de consentement, et première fois tout court que je participais à un atelier militant, et ce fût une très belle première fois ! […] je me suis sentie en sécurité et à l'aise pour participer facilement. Le contenu en lui-même a été très intéressant et m'a apporté des notions nouvelles alors que je pensais déjà être assez calée sur le sujet. Les exercices pratiques sont un vrai plus ! […]"
                  author: Leyla
              - type: link
                props:
                  href: /nos-ateliers#temoignages
                  className: self-start font-bold text-bleu-fonce underline decoration-pourpre decoration-2 underline-offset-4 hover:text-pourpre-hover
                content: Lire tous les témoignages →

      # Section: Reste en lien (#newsletter) — social links + the Brevo form,
      # injected into #newsletter-embed by /assets/brevo-embed.js.
      - type: container
        element: section
        props:
          id: newsletter
          className: px-4 sm:px-6 py-band-sm md:py-band bg-mauve-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-12 items-center
            children:
              - type: container
                props:
                  className: lg:col-span-5 flex flex-col gap-6
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-mauve
                    content: Communauté
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: reste en lien
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: "Inscris-toi pour recevoir nos prochains ateliers et nos ressources sur le consentement, ou suis-nous sur les réseaux."
                  - type: container
                    props:
                      className: flex flex-wrap gap-3
                    children:
                      - type: link
                        props:
                          href: https://www.instagram.com/mercipourtonnon/
                          target: _blank
