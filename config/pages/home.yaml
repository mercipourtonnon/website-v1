  author: Merci pour ton non
  robots: index, follow
  canonical: https://mercipourtonnon.fr

  openGraph:
    type: website
    title: Ateliers de sensibilisation et de consentement à Strasbourg | Merci pour ton non
    description: Ateliers gratuits, stands et interventions sur le consentement à Strasbourg. Apprends à dire non, pose tes limites.
    url: https://mercipourtonnon.fr
