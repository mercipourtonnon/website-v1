    description: Ateliers gratuits, stands et interventions sur le consentement à Strasbourg. Apprendre à dire non et poser ses limites.
    image: https://mercipourtonnon.fr/social.png
    imageAlt: Atelier sur le consentement - Merci pour ton non
    site: '@mercipourtonnon'
    creator: '@mercipourtonnon'

  # JSON-LD structured data — verbatim from the original site (asset URLs
  # migrated: /public/x → /x since public/ is served at the site root)
