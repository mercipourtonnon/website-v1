# / — the landing page: hero, the figures band (#chiffres), « tu es… » doors
# (#tu-es, which also carry the stands), the consent teaser, one testimonial
# and the « reste en lien » band (social links + newsletter, #newsletter).
# The workshop details moved to /nos-ateliers and the association to
# /notre-mission (review of 2026-10-09).
name: home
path: /
sitemap:
  priority: 1.0
  changefreq: weekly
meta:
  lang: fr-FR
  title: Merci pour ton non - Consentement à Strasbourg
  description: Ateliers de consentement gratuits à Strasbourg, stands et interventions. Apprendre à dire non et poser ses limites — don libre pour soutenir l'association.
