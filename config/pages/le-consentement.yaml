# /le-consentement — "notre vision du consentement": the knowledge shared
# during the Niveau 1 workshop. Since the review of 2026-10-09 the workshop
# techniques are steps of /nos-ateliers#programme and the bias list keeps six
# representative cards. One booking CTA only: the closing band.
# Source: the "Apports" blocks of the Notion Déroulé (Niveau 1 – Tout public)
# and the "Cartes Biais" page (reworked biases). Facilitation material —
# timings, instructions, materials, exercise scripts, learning objectives — is
# deliberately NOT published here.
