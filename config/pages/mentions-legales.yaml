                      - type: text
                        element: p
                        content: Les données sont hébergées conformément au RGPD (Règlement Général sur la Protection des Données).

              # Section 3: Limitations techniques
              - type: container
                element: section
                props:
                  className: mb-12
                children:
                  - type: text
                    element: h2
                    props:
                      className: text-xl title-font text-orange mb-4
                    content: limitations techniques
                  - type: container
                    props:
                      className: space-y-3 text-gray-700 leading-relaxed
                    children:
                      - type: text
                        element: p
                        content: "Le site mercipourtonnon.fr utilise les technologies web modernes pour te garantir la meilleure expérience possible. Pour profiter pleinement de toutes les fonctionnalités du site, nous te recommandons :"
                      - type: list
                        props:
                          className: list-disc list-inside space-y-2 ml-4
                        children:
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "JavaScript activé :"
                              - type: text
                                element: span
                                content: " Le site utilise JavaScript pour le menu de navigation mobile, les animations et certaines interactions. Certaines fonctionnalités peuvent être limitées si JavaScript est désactivé."
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Navigateur moderne :"
                              - type: text
                                element: span
                                content: " Nous recommandons d'utiliser les versions récentes de Chrome, Firefox, Safari ou Edge pour une expérience optimale."
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Hébergement :"
                              - type: text
                                element: span
                                content: " Le site public est publié en statique sur GitHub Pages et ne collecte aucune donnée par lui-même. L'application et ses données (ateliers, comptes des bénévoles et des facilitateur·ices, formulaires, statistiques de visite de l'application) sont hébergées sur Sovrium Cloud, conformément au RGPD."
                      - type: text
                        element: p
                        props:
                          className: mt-4
                        content: L'association Merci pour ton non met tout en œuvre pour assurer l'accessibilité et la disponibilité du site. Toutefois, nous ne pouvons être tenus responsables des difficultés d'accès temporaires liées à des problèmes techniques indépendants de notre volonté, à la maintenance programmée, ou aux caractéristiques de ton équipement.

              # Section 4: Protection des données personnelles (RGPD)
              - type: container
                element: section
                props:
                  className: mb-12
                children:
                  - type: text
                    element: h2
                    props:
                      className: text-xl title-font text-orange mb-4
                    content: protection des données personnelles

                  - type: text
                    element: h3
                    props:
                      className: text-xl title-font text-mauve mb-3 mt-6
                    content: données collectées
                  - type: container
                    props:
                      className: space-y-3 text-gray-700 leading-relaxed
                    children:
                      - type: text
                        element: p
                        content: "Dans le cadre de ton utilisation du site, nous sommes susceptibles de collecter les données suivantes :"
                      - type: list
                        props:
                          className: list-disc list-inside space-y-2 ml-4
                        children:
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Inscriptions aux ateliers :"
                              - type: text
                                element: span
                                content: " Gérées via la plateforme tierce HelloAsso, qui traite tes données d'inscription et de paiement (nom, prénom, email, réponses au formulaire d'inscription, téléphone si fourni, et ton paiement ou ton don si tu en fais un). Consulte la "
                              - type: link
                                props:
                                  href: https://www.helloasso.com/confidentialite
                                  target: _blank
                                  rel: noopener noreferrer
                                  className: text-orange hover:underline
                                content: politique de confidentialité de HelloAsso
                              - type: text
                                element: span
                                content: " pour plus d'informations."
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Suivi des ateliers :"
                              - type: text
                                element: span
                                content: " Quand tu t'inscris à un atelier, nous copions depuis HelloAsso dans l'outil interne de l'association ton nom, ton email, ton téléphone si tu l'as donné, le don éventuel, l'état de ton inscription et ta réponse sur les photos. Le jour de l'atelier, nous y notons ta présence. Si tu viens sans t'être inscrit·e, nous y notons ton nom (et ton email ou ton téléphone si tu nous les donnes). Seul·es les bénévoles qui accueillent les ateliers (facilitation et logistique) et le Cercle Gardien de l'association y ont accès."
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Comptes des facilitateur·ices :"
                              - type: text
                                element: span
                                content: " Les personnes qui animent nos ateliers ont un compte sur l'espace facilitateur·ices (nom, adresse email, mot de passe chiffré, propositions de dates). Ces comptes sont créés sur invitation par l'association, et servent uniquement à organiser les ateliers."
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Newsletter :"
                              - type: text
                                element: span
                                content: " Gérée via la plateforme tierce Brevo (prénom ou pseudo, adresse email). Ces données sont collectées uniquement avec ton consentement explicite lors de l'inscription. Consulte la "
                              - type: link
                                props:
                                  href: https://www.brevo.com/fr/legal/privacypolicy/
                                  target: _blank
                                  rel: noopener noreferrer
                                  className: text-orange hover:underline
                                content: politique de confidentialité de Brevo
                              - type: text
                                element: span
                                content: " pour plus d'informations."
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Statistiques de navigation :"
                              - type: text
                                element: span
                                content: " Sur l'application uniquement (espace bénévole, inscriptions, formulaires), via l'outil de statistiques intégré à notre hébergement : il compte les pages vues, la provenance des visites et le type d'appareil, sans cookie, côté serveur, sans empreinte de navigateur et sans service tiers. Les données restent sur notre serveur, et rien n'est enregistré si ton navigateur demande de ne pas être suivi (Do Not Track). Le site public, lui, n'a aucune statistique."

                  - type: text
                    element: h3
                    props:
                      className: text-xl title-font text-mauve mb-3 mt-6
                    content: finalité du traitement
                  - type: text
                    element: p
                    props:
                      className: text-gray-700 leading-relaxed
                    content: "Les données collectées sont utilisées uniquement pour :"
                  - type: list
                    props:
                      className: list-disc list-inside space-y-2 ml-4 text-gray-700
                    children:
                      - type: list-item
                        content: Gérer les inscriptions aux ateliers
                      - type: list-item
                        content: Te contacter concernant les ateliers auxquels tu t'es inscrit·e
                      - type: list-item
                        content: "Organiser l'accueil et le suivi des ateliers : t'accueillir, noter ta présence, te joindre en cas d'imprévu le jour J, et établir des statistiques globales (nombre de personnes, dons éventuels)"
                      - type: list-item
                        content: T'envoyer notre newsletter si tu t'y es inscrit·e (actualités, dates d'ateliers, ressources sur le consentement)
                      - type: list-item
                        content: Améliorer l'expérience utilisateur du site
                      - type: list-item
                        content: Répondre à tes demandes d'information
                      - type: list-item
                        content: "Gérer ton compte et ta fiche bénévole si tu rejoins l'équipe (inscription sur /devenir-benevole) : ton email et ton mot de passe pour le compte ; prénom et nom, pronom, téléphone, photo et ce que tu écris dans ta fiche pour mieux se connaître. L'email et le téléphone sont lus par la coordination seulement ; la fiche est visible des autres bénévoles une fois validée"
                      - type: list-item
                        content: "Lire et étudier les idées envoyées depuis /vos-idees (un atelier pour un public précis, un contenu, un format, un lieu) : le type d'idée, pour qui, et ton message ; ton prénom ou nom, ton e-mail et ton accord pour être recontacté·e sont facultatifs et ne servent qu'à te répondre. Lues par la coordination seulement"

                  - type: text
                    element: h3
                    props:
                      className: text-xl title-font text-mauve mb-3 mt-6
                    content: tes droits
                  - type: container
                    props:
                      className: space-y-3 text-gray-700 leading-relaxed
                    children:
                      - type: text
                        element: p
                        content: "Conformément au RGPD et à la loi Informatique et Libertés, tu disposes des droits suivants :"
                      - type: list
                        props:
                          className: list-disc list-inside space-y-2 ml-4
                        children:
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Droit d'accès :"
                              - type: text
                                element: span
                                content: " Tu peux demander l'accès aux données personnelles que nous détenons sur toi"
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Droit de rectification :"
                              - type: text
                                element: span
                                content: " Tu peux demander la correction de données inexactes ou incomplètes"
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Droit à l'effacement :"
                              - type: text
                                element: span
                                content: " Tu peux demander la suppression de tes données personnelles"
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Droit à la limitation du traitement :"
                              - type: text
                                element: span
                                content: " Tu peux demander la limitation du traitement de tes données"
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Droit à la portabilité :"
                              - type: text
                                element: span
                                content: " Tu peux demander de recevoir tes données dans un format structuré"
                          - type: list-item
                            children:
                              - type: text
                                element: span
                                props:
                                  className: font-bold
                                content: "Droit d'opposition :"
                              - type: text
                                element: span
                                content: " Tu peux t'opposer au traitement de tes données"
                      - type: text
                        element: p
                        props:
                          className: mt-4
                        children:
                          - type: text
                            element: span
                            content: "Pour exercer ces droits, contacte-nous à : "
                          - type: link
                            props:
                              href: mailto:mercipourtonnon@gmail.com
                              className: text-orange hover:underline font-semibold
                            content: mercipourtonnon@gmail.com
                      - type: text
                        element: p
                        children:
                          - type: text
                            element: span
                            content: "Si tu estimes que tes droits ne sont pas respectés, tu peux déposer une réclamation auprès de la CNIL (Commission Nationale de l'Informatique et des Libertés) : "
                          - type: link
                            props:
                              href: https://www.cnil.fr
                              target: _blank
                              rel: noopener noreferrer
                              className: text-orange hover:underline
                            content: www.cnil.fr

                  - type: text
                    element: h3
                    props:
                      className: text-xl title-font text-mauve mb-3 mt-6
                    content: durée de conservation
                  - type: text
                    element: p
                    props:
                      className: text-gray-700 leading-relaxed
                    content: Tes données personnelles sont conservées uniquement le temps nécessaire à la réalisation des finalités pour lesquelles elles ont été collectées, conformément aux obligations légales applicables.
                  - type: text
                    element: p
                    props:
                      className: mt-3 text-gray-700 leading-relaxed
                    content: "Pour le suivi des ateliers, ton nom, ton email et ton téléphone sont effacés de notre outil interne 12 mois après l'atelier. Nous ne gardons ensuite que des chiffres anonymes (nombre d'inscrit·es, de présent·es, dons éventuels)."
                  - type: text
                    element: p
                    props:
                      className: mt-3 text-gray-700 leading-relaxed
                    content: "Pour l'espace bénévole, ton compte et ta fiche sont conservés tant que tu fais partie de l'équipe. Quand tu la quittes, la coordination archive ta fiche et ferme ton accès ; compte et fiche sont supprimés sur simple demande à mercipourtonnon@gmail.com."
                  - type: text
                    element: p
                    props:
                      className: mt-3 text-gray-700 leading-relaxed
                    content: "Pour les idées envoyées depuis /vos-idees, le message et les coordonnées facultatives sont conservés 24 mois au plus, le temps de les étudier et de te répondre, puis supprimés — ou plus tôt, sur simple demande à mercipourtonnon@gmail.com."

              # Section 5: Cookies
              - type: container
                element: section
                props:
                  className: mb-12
                children:
                  - type: text
                    element: h2
                    props:
                      className: text-xl title-font text-orange mb-4
                    content: cookies
                  - type: container
                    props:
                      className: space-y-3 text-gray-700 leading-relaxed
                    children:
                      - type: text
                        element: p
                        content: "Notre site n'utilise aucun cookie publicitaire ni de suivi. Les seuls cookies sont techniques :"
                      - type: list
                        props:
                          className: list-disc list-inside space-y-2 ml-4
                        children:
                          - type: list-item
                            content: "Le cookie de session de l'espace facilitateur·ices : posé uniquement quand une personne se connecte, il la garde connectée. Il n'est lisible que par le serveur (httpOnly) et disparaît à la déconnexion ou à son expiration."
                          - type: list-item
                            content: "Le formulaire d'inscription à la newsletter (Brevo) peut utiliser des cookies techniques nécessaires à son fonctionnement."
                      - type: text
                        element: p
                        content: "Nos statistiques de visite ne posent aucun cookie : elles comptent les visites de façon anonyme, sans identifier personne. C'est pourquoi le site n'affiche pas de bandeau de consentement."
                      - type: text
                        element: p
                        props:
                          className: mt-4
                        content: Tu peux néanmoins désactiver les cookies dans les paramètres de ton navigateur si tu le souhaites. Note que la connexion à l'espace facilitateur·ices ne fonctionnera plus.

              # Section 6: Propriété intellectuelle
              - type: container
                element: section
                props:
                  className: mb-12
                children:
                  - type: text
                    element: h2
                    props:
                      className: text-xl title-font text-orange mb-4
                    content: propriété intellectuelle
                  - type: container
                    props:
                      className: space-y-3 text-gray-700 leading-relaxed
                    children:
                      - type: text
                        element: p
                        content: L'ensemble du contenu présent sur ce site (textes, images, graphismes, logo, icônes, etc.) est la propriété exclusive de l'association Merci pour ton non, sauf mention contraire.
                      - type: text
                        element: p
                        content: Toute reproduction, représentation, modification, publication, adaptation de tout ou partie des éléments du site, quel que soit le moyen ou le procédé utilisé, est interdite sans l'autorisation écrite préalable de l'association.
                      - type: text
                        element: p
                        content: Toute exploitation non autorisée du site ou de l'un des éléments qu'il contient sera considérée comme constitutive d'une contrefaçon et poursuivie conformément aux dispositions des articles L.335-2 et suivants du Code de Propriété Intellectuelle.

              # Section 7: Limitation de responsabilité
              - type: container
                element: section
                props:
                  className: mb-12
                children:
                  - type: text
                    element: h2
                    props:
                      className: text-xl title-font text-orange mb-4
                    content: limitation de responsabilité
                  - type: container
                    props:
                      className: space-y-3 text-gray-700 leading-relaxed
                    children:
