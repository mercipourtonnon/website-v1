      - type: container
        element: nav
        props:
          className: fixed top-0 left-0 right-0 z-50 w-full bg-white bg-opacity-90 backdrop-blur-sm shadow-lg
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4
            children:
              - type: container
                props:
                  className: flex justify-between items-center
                children:
                  - type: link
                    props:
                      href: /
                      className: flex items-center text-gray-700
                    children:
                      - type: image
                        props:
                          src: /logo-without-marging.svg
                          alt: Merci pour ton non
                          className: h-12 sm:h-14 lg:h-16 w-auto
                  - type: link
                    props:
                      href: /
                      className: text-gray-700 hover:text-orange font-medium transition text-sm
                    content: "← Retour à l'accueil"

      # Main Content
      - type: container
