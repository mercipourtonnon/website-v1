# /espace/suivi — "Suivi des ateliers": the figures across dates and one row
# per date, with a link to its check-in screen (/espace/suivi/:id).
# Figures aggregate over `workshops` (registrations_count, present_count,
# revenue_*): `registrations` carries no date, so a date window can only be
# applied on the workshop rows.
name: espace-suivi
path: /espace/suivi
access: { require: [admin, coordination, facilitateur], redirectTo: /connexion }
sitemap: false
meta:
  lang: fr-FR
  title: Suivi des ateliers - Espace facilitateur·ices
  description: Inscrit·es, présent·es et prix libre de chaque date d'atelier.
  noindex: true
  robots: noindex, nofollow
  favicon: ./favicon/favicon-32x32.png
components:
  - component: espace-shell
    children:
      - type: container
        props:
          className: mx-auto flex max-w-5xl flex-col gap-8
        children:
          - type: container
            element: header
            props:
              className: flex flex-col gap-1
            children:
              - type: text
                element: h1
                props:
                  className: text-3xl sm:text-4xl title-font text-bleu-fonce
                content: suivi des ateliers
              - type: text
                element: p
                props:
                  className: text-bleu-fonce
                content: Qui est inscrit·e, qui est venu·e, et le prix libre de chaque date. Le jour J, ouvre le suivi de ta date pour pointer les présences.

          # Figures. "À venir" counts the published dates from today; the money
          # covers the dates of the last 12 months (52 weeks) up to today.
          - type: container
            element: section
            props:
              aria-labelledby: chiffres-titre
              className: flex flex-col gap-3
            children:
              - type: text
                element: h2
                props:
                  id: chiffres-titre
                  className: text-xl title-font text-bleu-fonce
                content: en chiffres
              - type: grid
                props:
                  className: grid grid-cols-2 gap-3 lg:grid-cols-4
                children:
                  - type: kpi
                    label: Inscrit·es aux dates à venir
                    icon: users
                    size: { mobile: sm, md: md }
                    dataSource:
                      table: workshops
                      filter:
                        - { field: status, operator: eq, value: published }
                        - { field: session_date, operator: gte, value: $today }
                    kpiAggregate: { function: sum, field: registrations_count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Présent·es sur 12 mois
                    icon: user-check
                    size: { mobile: sm, md: md }
                    dataSource:
                      table: workshops
                      filter:
                        - { field: session_date, operator: gte, value: $today-52w }
                        - { field: session_date, operator: lte, value: $today }
                    kpiAggregate: { function: sum, field: present_count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Prix libre en ligne sur 12 mois
                    icon: credit-card
                    size: { mobile: sm, md: md }
                    dataSource:
                      table: workshops
                      filter:
                        - { field: session_date, operator: gte, value: $today-52w }
                        - { field: session_date, operator: lte, value: $today }
                    kpiAggregate: { function: sum, field: revenue_online }
                    kpiFormat: { type: currency, options: { currency: EUR } }
                  - type: kpi
                    label: Prix libre sur place sur 12 mois
                    icon: hand-coins
                    size: { mobile: sm, md: md }
                    dataSource:
                      table: workshops
                      filter:
                        - { field: session_date, operator: gte, value: $today-52w }
                        - { field: session_date, operator: lte, value: $today }
                    kpiAggregate: { function: sum, field: revenue_on_site }
                    kpiFormat: { type: currency, options: { currency: EUR } }

          - type: container
            element: section
            props:
              aria-labelledby: dates-titre
              className: flex flex-col gap-3
            children:
              - type: text
                element: h2
                props:
                  id: dates-titre
                  className: text-xl title-font text-bleu-fonce
                content: les dates
              - type: tabs
                defaultTab: a-venir
                panels:
                  - { id: a-venir, label: À venir }
                  - { id: passees, label: Passées }
                children:
                  # Grids rather than server-drawn lists: they print the money in
                  # euros the French way; the action column is the way in.
                  - type: table
                    caption: Dates à venir
                    classes: { parts: { caption: sr-only } }
                    readOnly: true
                    phoneLayout: scroll
                    dataSource:
                      table: workshops
                      filter:
                        - { field: status, operator: eq, value: published }
                        - { field: session_date, operator: gte, value: $today }
                      sort: [{ field: session_date, direction: asc }]
                      pagination: { pageSize: 25 }
                    onRowClick: { type: navigate, path: /espace/suivi/$record.id }
                    toolbar: { search: false, filters: false, sort: false, export: false, refresh: false }
                    emptyMessage: Aucune date à venir pour l'instant. Une date apparaît ici dès qu'elle est publiée sur le site.
                    columns:
                      - { field: session_date, label: Date, format: short-date, frozen: true, minWidth: 110 }
                      - { field: time_label, label: Heure }
                      - type: actions
                        label: Suivi
                        actions:
                          - label: Ouvrir le suivi
                            icon: clipboard-check
                            action: { type: fetch, mode: navigate, url: /espace/suivi/$record.id }
                      - { field: lead_name, label: Facilitation }
                      - { field: registrations_count, label: Inscrit·es }
                      - { field: capacity, label: Places }
                      - { field: present_count, label: Présent·es }
                      # The *_eur formulas: a rollup cannot declare a currency.
                      - { field: revenue_online_eur, label: En ligne, format: currency }
                      - { field: revenue_on_site_eur, label: Sur place, format: currency }
                      - { field: revenue_total, label: Total, format: currency }
                  - type: table
                    caption: Dates passées
                    classes: { parts: { caption: sr-only } }
                    readOnly: true
                    phoneLayout: scroll
                    dataSource:
                      table: workshops
                      filter:
                        - { field: session_date, operator: lt, value: $today }
                      sort: [{ field: session_date, direction: desc }]
                      pagination: { pageSize: 25 }
                    onRowClick: { type: navigate, path: /espace/suivi/$record.id }
                    toolbar: { search: false, filters: false, sort: false, export: false, refresh: false }
                    emptyMessage: Aucune date passée pour l'instant.
                    columns:
                      - { field: session_date, label: Date, format: short-date, frozen: true, minWidth: 110 }
                      - { field: time_label, label: Heure }
                      - type: actions
                        label: Suivi
                        actions:
                          - label: Ouvrir le suivi
                            icon: clipboard-check
                            action: { type: fetch, mode: navigate, url: /espace/suivi/$record.id }
                      - { field: lead_name, label: Facilitation }
                      - { field: registrations_count, label: Inscrit·es }
                      - { field: capacity, label: Places }
                      - { field: present_count, label: Présent·es }
                      # The *_eur formulas: a rollup cannot declare a currency.
                      - { field: revenue_online_eur, label: En ligne, format: currency }
                      - { field: revenue_on_site_eur, label: Sur place, format: currency }
                      - { field: revenue_total, label: Total, format: currency }
