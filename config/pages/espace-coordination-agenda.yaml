# /espace/coordination/agenda — logistique, communication and the Cercle Gardien edit events and their needs
# in grids (in-cell editing, « Nouvelle ligne », the row panel for the
# rich-text fields), and reads who signed up to what. Every status shows here,
# drafts included. Publishing = setting the status to Publié.
name: espace-coordination-agenda
path: /espace/coordination/agenda
access: { require: ['group:logistique', 'group:communication', gardien, admin], redirectTo: /connexion }
sitemap: false
meta:
  lang: fr-FR
  title: Agenda à gérer - Espace bénévole
  description: Créer, publier et suivre les rendez-vous des bénévoles.
  noindex: true
  robots: noindex, nofollow
  favicon: ./favicon/favicon-32x32.png
components:
  - component: espace-shell
    children:
      - type: container
        props:
          className: mx-auto flex max-w-6xl flex-col gap-8
        children:
          - type: container
            element: header
            props:
              className: flex flex-col gap-1
            children:
              - type: text
                element: h1
                props:
                  className: text-3xl sm:text-4xl title-font text-bleu-fonce
                content: agenda à gérer
              - type: text
                element: p
                props:
                  className: text-bleu-fonce
                content: "Crée un rendez-vous en brouillon, ajoute ses besoins, puis passe-le en « Publié » : il apparaît alors dans l'agenda des bénévoles."
          - type: container
            element: section
            props:
              aria-labelledby: evenements-titre
              className: flex flex-col gap-3
            children:
              - type: text
                element: h2
                props:
                  id: evenements-titre
                  className: text-2xl title-font text-bleu-fonce
                content: rendez-vous
              - type: container
                props:
                  role: toolbar
                  aria-label: Rechercher et filtrer
                  className: flex flex-wrap items-center gap-2
                children:
                  - type: search-input
                    placeholder: Rechercher
                    props:
                      aria-label: Rechercher
                      className: "h-8 w-full sm:w-[250px]"
                    publishes: { bindTo: espace-coordination-agenda-events-1, param: q }
                  - type: filter-bar
                    publishes: { bindTo: espace-coordination-agenda-events-1 }
                    fieldsFrom: { table: events }
              - type: table
                caption: Rendez-vous
                classes: { parts: { caption: sr-only } }
                phoneLayout: rows
                dataSource:
                  bindTo: espace-coordination-agenda-events-1
                  sharedFilter: {}
                  table: events
                  sort: [{ field: starts_at, direction: desc }]
                  pagination: { pageSize: 25 }
                emptyMessage: Aucun rendez-vous pour l'instant. Crée le premier avec « Nouvelle ligne ».
                rowExpand:
                  title: Rendez-vous
                  fields: [title, type, status, starts_at, ends_at, location, video_url, purpose, programme, practical_info, image]
                columns:
                  - { field: title, label: Titre }
                  - field: status
                    label: Statut
                    badgeForm: outline-dot
                    valueLabels: { draft: Brouillon, published: Publié, cancelled: Annulé }
                    cellStyle:
                      - { when: { eq: draft }, tone: warning }
                      - { when: { eq: published }, tone: success }
                      - { when: { eq: cancelled }, tone: muted }
                  - { field: type, label: Type }
                  - { field: starts_at, label: Début, format: datetime }
                  - { field: ends_at, label: Fin, format: datetime }
                  - { field: location, label: Lieu }
                  - { field: video_url, label: Visio }
          - type: container
            element: section
            props:
              aria-labelledby: besoins-titre
              className: flex flex-col gap-3
            children:
              - type: text
                element: h2
                props:
                  id: besoins-titre
                  className: text-2xl title-font text-bleu-fonce
                content: besoins
              - type: text
                element: p
                props:
                  className: text-bleu-fonce
                content: Ce dont chaque rendez-vous a besoin (« Tenir le stand 14h–16h », « Apporter à manger »), avec le nombre de places. Les places restantes se calculent toutes seules.
              - type: container
                props:
                  role: toolbar
                  aria-label: Rechercher et filtrer
                  className: flex flex-wrap items-center gap-2
                children:
                  - type: search-input
                    placeholder: Rechercher
                    props:
                      aria-label: Rechercher
                      className: "h-8 w-full sm:w-[250px]"
                    publishes: { bindTo: espace-coordination-agenda-event_needs-2, param: q }
                  - type: filter-bar
                    publishes: { bindTo: espace-coordination-agenda-event_needs-2 }
                    fieldsFrom: { table: event_needs }
              - type: table
                caption: Besoins
                classes: { parts: { caption: sr-only } }
                phoneLayout: rows
                dataSource:
                  bindTo: espace-coordination-agenda-event_needs-2
                  sharedFilter: {}
                  table: event_needs
                  sort: [{ field: event, direction: desc }, { field: position, direction: asc }]
                  pagination: { pageSize: 50 }
                emptyMessage: Aucun besoin pour l'instant. Ajoute-en un avec « Nouvelle ligne » et choisis son rendez-vous.
                columns:
                  - { field: event, label: Rendez-vous }
                  - { field: label, label: Besoin }
                  - { field: description, label: Description, truncate: true }
                  - { field: slots, label: Places, align: right }
                  - { field: signed_up, label: Inscrit·es, align: right }
                  - field: remaining
                    label: Restantes
                    align: right
                    cellStyle:
                      - { when: { lte: 0 }, tone: muted }
                  - { field: position, label: Ordre, align: right }
          - type: container
            element: section
            props:
              aria-labelledby: inscriptions-titre
              className: flex flex-col gap-3
            children:
              - type: text
                element: h2
                props:
                  id: inscriptions-titre
                  className: text-2xl title-font text-bleu-fonce
                content: qui vient à quoi
              - type: container
                props:
                  role: toolbar
                  aria-label: Rechercher et filtrer
                  className: flex flex-wrap items-center gap-2
                children:
                  - type: search-input
                    placeholder: Rechercher
                    props:
                      aria-label: Rechercher
                      className: "h-8 w-full sm:w-[250px]"
                    publishes: { bindTo: espace-coordination-agenda-event_participations-3, param: q }
                  - type: filter-bar
                    publishes: { bindTo: espace-coordination-agenda-event_participations-3 }
                    fieldsFrom: { table: event_participations }
                  - type: button
                    label: Exporter en CSV
                    variant: outline
                    size: sm
                    props: { className: sm:ml-auto }
                    action: { type: fetch, mode: download, url: /api/tables/event_participations/export?format=csv, filename: event_participations.csv }
              - type: table
                caption: Inscriptions des bénévoles
                classes: { parts: { caption: sr-only } }
                readOnly: true
                phoneLayout: rows
                dataSource:
                  bindTo: espace-coordination-agenda-event_participations-3
                  sharedFilter: {}
                  table: event_participations
                  sort: [{ field: event, direction: desc }, { field: created_at, direction: asc }]
                  pagination: { pageSize: 50 }
                emptyMessage: Aucune inscription pour l'instant.
                columns:
                  - { field: event, label: Rendez-vous }
                  - { field: member, label: Bénévole }
                  - { field: need, label: Besoin }
                  - { field: comment, label: Commentaire, truncate: true }
                  - { field: created_at, label: Inscrit·e le, format: short-date }
