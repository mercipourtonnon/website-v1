# /nos-interventions — the offer for structures (à but non lucratif, petites
# structures et ESS, entreprises), written from the BPS (3.16 structures,
# 1.18 formats, 2.16 references) in the review of 2026-10-09. Sections:
# #structures · #formats (with « comment on travaille ») · #tarifs (« sur
# devis », no price published since 2026-10-10) · #references · témoignage ·
# #contact.
name: nos-interventions
path: /nos-interventions
sitemap:
  priority: 0.6
  changefreq: monthly
meta:
  lang: fr-FR
  title: Interventions pour les structures - Merci pour ton non
  description: "Intervention sur le consentement pour ta structure, à Strasbourg et en Alsace : atelier découverte, demi-journée ou journée, gratuit pour les participant·es."
  author: Merci pour ton non
  robots: index, follow
  canonical: https://mercipourtonnon.fr/nos-interventions
  openGraph:
    type: website
    title: Interventions sur le consentement pour les structures | Merci pour ton non
    description: "Structures à but non lucratif, petites structures, entreprises : une demi-journée ou une journée sur le consentement, construite avec toi. Les participant·es ne paient jamais."
    url: https://mercipourtonnon.fr/nos-interventions
    image: https://mercipourtonnon.fr/social.png
    imageAlt: Merci pour ton non — nos interventions auprès de structures
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: Interventions pour les structures | Merci pour ton non
    description: "Structures à but non lucratif, petites structures, entreprises : une demi-journée ou une journée sur le consentement, construite avec toi. Les participant·es ne paient jamais."
    image: https://mercipourtonnon.fr/social.png
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
      - size: 32x32
        href: /favicon/favicon-32x32.png
      - size: 16x16
        href: /favicon/favicon-16x16.png
  preload:
    - href: /fonts/NeueMachina/NeueMachina-Regular.otf
      as: font
      type: font/otf
      crossorigin: anonymous
    - href: /fonts/BelyDisplay/BelyDisplay-Regular.woff2
      as: font
      type: font/woff2
      crossorigin: anonymous
  customElements:
    - type: meta
      attrs:
        name: theme-color
        content: '#7B01FE'
    - type: link
      attrs:
        rel: manifest
        href: /favicon/site.webmanifest

scripts:
  externalScripts:
    # Mobile menu close-on-link / Escape, current page (site.js)
    - src: /assets/site.js
      defer: true
      position: body-end

components:
  - component: site-header

  - type: container
    props:
      id: contenu
      className: bg-white overflow-x-clip
    children:
      # Page header
      - type: container
        element: section
        props:
          className: px-4 sm:px-6 pt-10 md:pt-16 pb-band-sm md:pb-band bg-mauve-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-12 items-center
            children:
              - type: container
                props:
                  className: lg:col-span-6 flex flex-col gap-6
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-mauve
                    content: Nos actions · Interventions
                  - type: text
                    element: h1
                    props:
                      className: type-page text-bleu-fonce
                    content: nos interventions auprès de structures
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce max-w-xl
                    content: "On intervient dans les structures à but non lucratif, les petites structures et les entreprises, à Strasbourg et en Alsace, avec un format construit avec toi. Les participant·es ne paient jamais."
                  - type: container
                    props:
                      className: flex flex-wrap items-center gap-4
                    children:
                      - type: link
                        props:
                          href: '#contact'
                          className: inline-flex items-center gap-2 whitespace-nowrap bg-mauve text-white px-6 py-3 rounded-pill font-bold hover:bg-mauve-hover transition-colors
                        children:
                          - type: text
                            element: span
                            content: Parler de ton projet
                          - type: icon
                            props: { name: arrow-down, size: 20, strokeWidth: 2 }
              - type: container
                props:
                  className: lg:col-span-6 photo-frame frame-cyan
                children:
                  - type: image
                    variant: hero
                    props:
                      src: /pictures/atelier/dilara-mathilde-animent.webp
                      srcset: /pictures/atelier/dilara-mathilde-animent-sm.webp 800w, /pictures/atelier/dilara-mathilde-animent.webp 1600w
                      sizes: '(min-width: 1024px) 600px, 100vw'
                      alt: Dilara et Mathilde, assises face au groupe, animent un temps d'échange
                      className: w-full h-auto rounded-media shadow-raised object-cover aspect-[3/2]

      # Section: Pour quelles structures (#structures) — BPS 3.16
      - type: container
        element: section
        props:
          id: structures
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4 max-w-2xl
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-mauve
                    content: Pour qui
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: pour quelles structures ?
              - type: container
                props:
                  className: grid md:grid-cols-3 gap-6
                children:
                  - component: audience-card
                    vars:
                      iconBg: bg-mauve-light
                      icon: heart-handshake
                      accent: text-mauve
                      title: structures à but non lucratif
                      text: "Écoles, centres socio-culturels, CROUS, associations, médiathèques : l'atelier contribue directement à ta mission. On cherche un financement par subvention ou convention avec toi."
                  - component: audience-card
                    vars:
                      iconBg: bg-mauve-light
                      icon: users
                      accent: text-mauve
                      title: petites structures, collectifs et coopératives
                      text: "Une équipe, un collectif, une coopérative : un format à la taille de ton groupe."
                  - component: audience-card
                    vars:
                      iconBg: bg-mauve-light
                      icon: building-2
                      accent: text-mauve
                      title: entreprises et grandes institutions
                      text: "Prévention collective du harcèlement, culture commune du non, qualité de vie au travail — et ton intervention finance nos ateliers gratuits."

      # Section: Deux formats (#formats) — BPS 1.18, with « comment on travaille »
      - type: container
        element: section
        props:
          id: formats
          className: px-4 sm:px-6 py-band-sm md:py-band bg-cyan-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4 max-w-2xl
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-cyan-ink
                    content: Formats
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: deux formats
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: Le même atelier que pour le grand public, dans ta structure, avec deux facilitateur·ices.
              - type: container
                props:
                  className: grid md:grid-cols-2 gap-6
                children:
                  - type: container
                    element: article
                    props: { className: bg-white rounded-card shadow-card p-6 md:p-8 flex flex-col gap-3 }
                    children:
                      - type: container
                        props: { className: w-12 h-12 rounded-pill bg-cyan-light flex items-center justify-center mb-1 }
                        children:
                          - type: icon
                            props: { name: clock, size: 24, strokeWidth: 2, className: text-cyan-ink, aria-hidden: 'true' }
                      - type: text
                        element: p
                        props: { className: type-overline text-cyan-ink }
                        content: Une demi-journée
                      - type: text
                        element: h3
                        props: { className: type-h3 text-bleu-fonce }
                        content: atelier découverte
                      - type: text
                        element: p
                        props: { className: text-bleu-fonce }
                        content: "3 h à 3 h 30, de 6 à 15 personnes, deux facilitateur·ices. Nos exercices et l'acronyme RÈGLES, pour poser ses limites et entendre celles des autres."
                  - type: container
                    element: article
                    props: { className: bg-white rounded-card shadow-card p-6 md:p-8 flex flex-col gap-3 }
                    children:
                      - type: container
                        props: { className: w-12 h-12 rounded-pill bg-cyan-light flex items-center justify-center mb-1 }
                        children:
                          - type: icon
                            props: { name: calendar-days, size: 24, strokeWidth: 2, className: text-cyan-ink, aria-hidden: 'true' }
                      - type: text
                        element: p
                        props: { className: type-overline text-cyan-ink }
                        content: Une journée
                      - type: text
                        element: h3
                        props: { className: type-h3 text-bleu-fonce }
                        content: deux temps dans la journée
                      - type: text
                        element: p
                        props: { className: text-bleu-fonce }
                        content: "Deux ateliers pour deux groupes, ou un atelier le matin et, l'après-midi, un temps de travail sur vos situations."
              # Comment on travaille — the three steps, kept from the first version
              - type: container
                props:
                  className: flex flex-col gap-6
                children:
                  - type: text
                    element: h3
                    props:
                      className: type-h3 text-bleu-fonce
                    content: comment on travaille
                  - type: container
                    element: div
                    props:
                      role: list
                      className: grid md:grid-cols-3 gap-6
                    children:
                      - type: container
                        element: div
                        props: { role: listitem, className: bg-white rounded-card shadow-card p-6 flex flex-col gap-3 }
                        children:
                          - type: text
                            element: span
                            props: { className: w-10 h-10 rounded-pill bg-mauve text-white font-bold flex items-center justify-center, aria-hidden: 'true' }
                            content: '1'
                          - type: text
                            element: h4
                            props: { className: type-h4 text-bleu-fonce }
                            content: on échange sur tes besoins
                          - type: text
                            element: p
                            props: { className: type-small text-bleu-fonce-70 }
                            content: Ton public, ce qui se passe dans ta structure, ce que tu aimerais voir changer.
                      - type: container
                        element: div
                        props: { role: listitem, className: bg-white rounded-card shadow-card p-6 flex flex-col gap-3 }
                        children:
                          - type: text
                            element: span
                            props: { className: w-10 h-10 rounded-pill bg-mauve text-white font-bold flex items-center justify-center, aria-hidden: 'true' }
                            content: '2'
                          - type: text
                            element: h4
                            props: { className: type-h4 text-bleu-fonce }
                            content: on construit le format ensemble
                          - type: text
                            element: p
                            props: { className: type-small text-bleu-fonce-70 }
                            content: Demi-journée ou journée, nombre de personnes, lieu et date, à partir de nos notions et de nos exercices.
                      - type: container
                        element: div
                        props: { role: listitem, className: bg-white rounded-card shadow-card p-6 flex flex-col gap-3 }
                        children:
                          - type: text
                            element: span
                            props: { className: w-10 h-10 rounded-pill bg-mauve text-white font-bold flex items-center justify-center, aria-hidden: 'true' }
                            content: '3'
                          - type: text
                            element: h4
                            props: { className: type-h4 text-bleu-fonce }
                            content: on intervient, puis on fait le point
                          - type: text
                            element: p
                            props: { className: type-small text-bleu-fonce-70 }
                            content: Deux facilitateur·ices animent l'intervention dans un cadre bienveillant, puis on prend un temps avec toi pour en tirer les suites.

      # Section: Tarifs (#tarifs) — no price grid since 2026-10-10 (author's
      # decision): « sur devis », pointing to the association's email.
      - type: container
        element: section
        props:
          id: tarifs
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-3xl mx-auto flex flex-col gap-4 text-bleu-fonce
            children:
              - type: text
                element: h2
                props:
                  className: type-section text-bleu-fonce
                content: combien ça coûte ?
              - type: text
                element: p
                props:
                  className: type-lead text-bleu-fonce
                children:
                  - type: text
                    element: span
                    props: { className: font-bold }
                    content: Les participant·es ne paient jamais.
                  - type: text
                    element: span
                    content: " Pour ta structure, c'est sur devis, selon ton public et le format : "
                  - type: link
                    props:
                      href: mailto:mercipourtonnon@gmail.com?subject=Intervention%20dans%20ma%20structure
                      className: font-bold text-bleu-fonce underline decoration-mauve decoration-2 underline-offset-4 hover:text-mauve
                    content: écris-nous
                  - type: text
                    element: span
                    content: ", on en parle. Ce qui est facturé finance nos ateliers gratuits."
              - type: text
                element: p
                props:
                  className: text-bleu-fonce-70
                content: "Pas de budget ? On ouvre l'atelier au grand public ou on cherche un financement ensemble — on n'intervient pas gratuitement sur commande."

      # Section: Références (#references) — BPS 2.16, shipped visible (A6)
      - type: container
        element: section
        props:
          id: references
          className: px-4 sm:px-6 py-band-sm md:py-band bg-cyan-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4 max-w-2xl
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-cyan-ink
                    content: Références
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: ils nous ont fait confiance
              - type: container
                props:
                  className: grid md:grid-cols-2 gap-6
                children:
                  - component: partner-row
                    vars:
                      icon: landmark
                      role: Première commande
                      name: Ville de Strasbourg
                      text: Animation d'un stand à la Fête de la musique, juin 2026.
                      href: https://www.strasbourg.eu
                      linkLabel: Découvrir la Ville de Strasbourg
                  - component: partner-row
                    vars:
                      icon: graduation-cap
                      role: Premier atelier réservé
                      name: Unis-Cité
                      text: Un atelier prévu en décembre 2026 pour 8 volontaires en service civique.
                      href: https://www.uniscite.fr
                      linkLabel: Découvrir Unis-Cité

      # Section: Témoignage — the participant who asked for it in so many words
      - type: container
        element: section
        props:
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-3xl mx-auto
            children:
              - component: testimonial-card
                vars:
                  size: type-lead
                  quote: "Cet atelier aurait le mérite d'être proposé en milieu professionnel, en milieu associatif, dans les lycées, dans les facs, sur les sites de rencontres amoureux et amicaux, et partout dans le monde en fait. J'ai encore appris de nouvelles choses sur moi-même et sur les relations interpersonnelles en général. Ça fait grandir et c'est inspirant."
                  author: Alex

      # Section: Contact (#contact)
      - type: container
        element: section
        props:
          id: contact
          className: px-4 sm:px-6 pb-band-sm md:pb-band
        children:
          - type: container
            props:
              className: max-w-5xl mx-auto bg-orange-light rounded-media p-8 md:p-12 grid md:grid-cols-12 gap-8 items-center
            children:
              - type: container
                props:
                  className: md:col-span-8 flex flex-col gap-4
                children:
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: parlons de ton projet
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce
                    content: Dis-nous qui tu es, quel public tu accueilles et ce que tu imagines. On te répond par email pour en discuter.
                  # /notre-mission#chiffres lands with the next batch of the review.
                  - type: text
                    element: p
                    props:
                      className: type-small text-bleu-fonce-70
                    children:
                      - type: text
                        element: span
                        content: "Tu es un financeur ou une collectivité ? Les chiffres et le besoin social sont sur "
                      - type: link
                        props:
                          href: /notre-mission#chiffres
                          className: font-bold text-bleu-fonce underline underline-offset-4 hover:text-mauve
                        content: notre mission
                      - type: text
                        element: span
                        content: .
              - type: container
                props:
                  className: md:col-span-4 flex md:justify-end
                children:
                  - type: link
                    props:
                      href: mailto:mercipourtonnon@gmail.com?subject=Intervention%20dans%20ma%20structure
                      className: inline-flex items-center gap-2 whitespace-nowrap bg-orange text-bleu-fonce px-6 py-3 rounded-pill font-bold hover:bg-orange-hover transition-colors shadow-card
                    children:
                      - type: icon
                        props: { name: mail, size: 20, strokeWidth: 2 }
                      - type: text
                        element: span
                        content: Écrire à l'association

  - component: site-footer
