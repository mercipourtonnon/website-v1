# /ressources — "nos ressources": supports de communication and contenus
# pédagogiques to download (review of 2026-10-09; the stand band moved to
# /nos-stands). Adding a resource = adding one `resource-card` instance to the
# matching group below. Files are hosted on kDrive
# (the print masters are too heavy for the repo); only a light thumbnail
# lives in public/resources/.
name: ressources
path: /ressources
sitemap:
  priority: 0.7
  changefreq: monthly
meta:
  lang: fr-FR
  title: Nos ressources sur le consentement - Merci pour ton non
  description: Affiches et supports sur le consentement à imprimer, afficher et partager librement, par l'association Merci pour ton non à Strasbourg.
  author: Merci pour ton non
  robots: index, follow
  canonical: https://mercipourtonnon.fr/ressources
  openGraph:
    type: website
    title: Ressources sur le consentement | Merci pour ton non
    description: Affiches et supports à imprimer, afficher et partager librement.
    url: https://mercipourtonnon.fr/ressources
    image: https://mercipourtonnon.fr/social.png
    imageAlt: Merci pour ton non — ressources à télécharger
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: Ressources sur le consentement | Merci pour ton non
    description: Affiches et supports à imprimer, afficher et partager librement.
    image: https://mercipourtonnon.fr/social.png
  schema:
    '@context': https://schema.org
    '@type': CollectionPage
    name: Ressources sur le consentement
    description: Affiches et supports sur le consentement à imprimer, afficher et partager librement.
    inLanguage: fr-FR
    url: https://mercipourtonnon.fr/ressources
    publisher:
      '@type': Organization
      name: Merci pour ton non
      url: https://mercipourtonnon.fr
    hasPart:
      - '@type': CreativeWork
        name: Série de 5 affiches A3 sur le consentement
        encodingFormat: application/pdf
        url: https://kdrive.infomaniak.com/app/share/3042221/15e326c4-bee4-4b34-a443-838de7a36201
        thumbnailUrl: https://mercipourtonnon.fr/resources/affiche-a3.webp
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
      - size: 32x32
        href: /favicon/favicon-32x32.png
      - size: 16x16
        href: /favicon/favicon-16x16.png
  preload:
    - href: /fonts/NeueMachina/NeueMachina-Regular.otf
      as: font
      type: font/otf
      crossorigin: anonymous
    - href: /fonts/BelyDisplay/BelyDisplay-Regular.woff2
      as: font
      type: font/woff2
      crossorigin: anonymous
  customElements:
    - type: meta
      attrs:
        name: theme-color
        content: '#12A19D'
    - type: link
      attrs:
        rel: manifest
        href: /favicon/site.webmanifest

scripts:
  externalScripts:
    # Mobile menu close-on-link / Escape, current page (site.js)
    - src: /assets/site.js
      defer: true
      position: body-end

components:
  - component: site-header

  - type: container
    props:
      id: contenu
      className: bg-white overflow-x-clip
    children:
      # Page header
      - type: container
        element: section
        props:
          className: px-4 sm:px-6 pt-10 md:pt-16 pb-band-sm md:pb-band bg-cyan-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto grid lg:grid-cols-12 gap-12 items-center
            children:
              - type: container
                props:
                  className: lg:col-span-6 flex flex-col gap-6
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-cyan-ink
                    content: Ressources
                  - type: text
                    element: h1
                    props:
                      className: type-page text-bleu-fonce
                    content: nos ressources
                  - type: text
                    element: p
                    props:
                      className: type-h4 font-bold text-bleu-fonce
                    content: Contenus pédagogiques et supports à télécharger
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce max-w-xl
                    content: "Pour faire vivre la culture du consentement là où tu es : au travail, dans ton asso, ta fac ou ton lieu de vie. Télécharge-les, imprime-les, affiche-les — ils sont faits pour circuler."
              - type: container
                props:
                  className: lg:col-span-6 photo-frame frame-orange
                children:
                  - type: image
                    variant: hero
                    props:
                      src: /pictures/atelier/flyer-mains.webp
                      srcset: /pictures/atelier/flyer-mains-sm.webp 800w, /pictures/atelier/flyer-mains.webp 1600w
                      sizes: '(min-width: 1024px) 600px, 100vw'
                      alt: Deux mains tiennent le flyer « Le consentement, ça te parle ? » au milieu des plantes
                      className: w-full h-auto rounded-media shadow-raised object-cover aspect-[3/2]

      # Help band — block 1 of the page (review of 2026-10-09): the numbers to
      # call come before the downloads.
      - type: container
        element: section
        props:
          id: besoin-d-aide
          className: px-4 sm:px-6 pt-band-sm md:pt-band
        children:
          - component: help-now-band

      # Resources, in two groups (#telechargements kept as the anchor of the list)
      - type: container
        element: section
        props:
          id: telechargements
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-5xl mx-auto flex flex-col gap-band-sm
            children:
              # Group 1: supports de communication
              - type: container
                props:
                  id: supports-de-communication
                  className: flex flex-col gap-block
                children:
                  - type: container
                    props:
                      className: flex flex-col gap-3
                    children:
                      - type: text
                        element: h2
                        props:
                          className: type-section text-bleu-fonce
                        content: supports de communication
                      - type: text
                        element: p
                        props:
                          className: type-lead text-bleu-fonce-70 max-w-2xl
                        content: Affiches et visuels à imprimer et à partager, en libre accès.
                  - type: container
                    props:
                      className: grid gap-6
                    children:
                      - component: resource-card
                        vars:
                          thumb: /resources/affiche-a3.webp
                          thumbAlt: Aperçu de l'affiche « Pas touche sans demander » — un cactus en fleur dans un pot rose, sur fond jaune
                          meta: PDF · A3 · 5 pages
                          title: série de 5 affiches
                          text: « Pas touche sans demander », « Si tu fais l'anguille, c'est que c'est non ! », « Recevoir un "non" est un cadeau », « On peut changer de disque ! » et « Dire "non" n'est pas une trahison ». Cinq affiches au format A3, pensées pour être imprimées et affichées.
                          href: https://kdrive.infomaniak.com/app/share/3042221/15e326c4-bee4-4b34-a443-838de7a36201
                          cta: Télécharger les affiches
              # Group 2: contenus pédagogiques — empty until the first one ships.
              - type: container
                props:
                  id: contenus-pedagogiques
                  className: flex flex-col gap-block
                children:
                  - type: container
                    props:
                      className: flex flex-col gap-3
                    children:
                      - type: text
                        element: h2
                        props:
                          className: type-section text-bleu-fonce
                        content: contenus pédagogiques
                      - type: text
                        element: p
                        props:
                          className: type-lead text-bleu-fonce-70 max-w-2xl
                        content: Des fiches et des outils pour parler du consentement autour de toi.
                  - type: container
                    props:
                      className: rounded-card border-2 border-dashed border-cyan-lighter bg-cyan-light p-8 flex flex-col sm:flex-row sm:items-center gap-4
                    children:
                      - type: icon
                        props: { name: hourglass, size: 28, strokeWidth: 2, className: text-cyan-ink shrink-0 }
                      - type: container
                        props:
                          className: flex flex-col gap-1
                        children:
                          - type: text
                            element: p
                            props:
                              className: font-bold text-bleu-fonce
                            content: Bientôt ici.
                          - type: text
                            element: p
                            props:
                              className: type-small text-bleu-fonce-70
                            children:
                              - type: text
                                element: span
                                content: 'On prépare nos premiers contenus. En attendant, les notions de nos ateliers sont en libre accès : '
                              - type: link
                                props:
                                  href: /le-consentement
                                  className: font-bold text-cyan-ink underline underline-offset-4 hover:text-bleu-fonce
                                content: notre vision du consentement
                              - type: text
                                element: span
                                content: .
              - type: text
                element: p
                props:
                  className: type-small text-bleu-fonce-70
                children:
                  - type: text
                    element: span
                    content: 'Besoin d''un autre format ou de supports imprimés ? '
                  - type: link
                    props:
                      href: mailto:mercipourtonnon@gmail.com
                      className: font-bold text-bleu-fonce underline underline-offset-4 hover:text-mauve
                    content: Écris-nous
                  - type: text
                    element: span
                    content: .

  - component: site-footer
