# /ressources — "nos ressources" (review of 2026-10-09, Batch 4): the numbers
# to call, our own supports, then the curated references the BPS review
# gathered, drawn live from the `ressources` table (seeded from
# seed/ressources.yaml). Seven blocks, one
# server-rendered `list` per block (`children` form; `dataSource.limit: 100`
# so no pager appears), each sorted by `position` and hidden when empty.
# Adding a reference = adding a row (console or seed), not editing this page.
# Only rows with `verified` set are listed (review of 2026-10-10): a reference
# appears once an admin has opened its link.
# The `aide` rows of the table mirror the static `help-now-band` and are not
# listed here. Our own supports stay hand-placed `resource-card`s: the print
# masters are hosted on kDrive, only a light thumbnail lives in public/resources/.
name: ressources
path: /ressources
sitemap:
  priority: 0.7
  changefreq: monthly
meta:
  lang: fr-FR
  title: Ressources sur le consentement - Merci pour ton non
  description: Numéros d'aide, affiches à imprimer, livres, films, podcasts, jeux et textes sur le consentement, choisis par Merci pour ton non à Strasbourg.
  author: Merci pour ton non
  noindex: true # PRE-LAUNCH: remove at launch
  robots: noindex, nofollow # PRE-LAUNCH: restore "index, follow" at launch
  canonical: https://mercipourtonnon.fr/ressources
  openGraph:
    type: website
    title: "Ressources : aide, livres, films, podcasts | Merci pour ton non"
    description: Numéros d'aide, nos affiches à imprimer, et une sélection de livres, films, podcasts, jeux et textes sur le consentement.
    url: https://mercipourtonnon.fr/ressources
    image: https://mercipourtonnon.fr/social.png
    imageAlt: Merci pour ton non — ressources sur le consentement
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: "Ressources : aide, livres, films, podcasts | Merci pour ton non"
    description: Numéros d'aide, nos affiches à imprimer, et une sélection de livres, films, podcasts, jeux et textes sur le consentement.
    image: https://mercipourtonnon.fr/social.png
  schema:
    '@context': https://schema.org
    '@type': CollectionPage
    name: Ressources sur le consentement
    description: Numéros d'aide, affiches à imprimer, et une sélection de livres, films, podcasts, jeux et textes sur le consentement, choisie par l'association Merci pour ton non.
    inLanguage: fr-FR
    url: https://mercipourtonnon.fr/ressources
    about:
      - '@type': Thing
        name: Consentement
      - '@type': Thing
        name: Violences sexistes et sexuelles
      - '@type': Thing
        name: Éducation à la vie affective
    publisher:
      '@type': Organization
      name: Merci pour ton non
      url: https://mercipourtonnon.fr
    hasPart:
      - '@type': CreativeWork
        name: Série de 5 affiches A3 sur le consentement
        encodingFormat: application/pdf
        url: https://kdrive.infomaniak.com/app/share/3042221/15e326c4-bee4-4b34-a443-838de7a36201
        thumbnailUrl: https://mercipourtonnon.fr/resources/affiche-a3.webp
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
      - size: 32x32
        href: /favicon/favicon-32x32.png
      - size: 16x16
        href: /favicon/favicon-16x16.png
  preload:
    - href: /fonts/NeueMachina/NeueMachina-Regular.otf
      as: font
      type: font/otf
      crossorigin: anonymous
    - href: /fonts/BelyDisplay/BelyDisplay-Regular.woff2
      as: font
      type: font/woff2
      crossorigin: anonymous
  customElements:
    - type: meta
      attrs:
        name: theme-color
        content: '#12A19D'
    - type: link
      attrs:
        rel: manifest
        href: /favicon/site.webmanifest

scripts:
  externalScripts:
    # Mobile menu close-on-link / Escape, current page (site.js)
    - src: /assets/site.js
      defer: true
      position: body-end

components:
