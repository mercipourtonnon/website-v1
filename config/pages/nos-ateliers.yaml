# /nos-ateliers — everything about the Niveau 1 workshop: what it is, who it
# is for, the programme (with the two techniques moved from /le-consentement),
# the practical facts, our frame (#cadre, with the help band), testimonials,
# FAQ and the upcoming dates (#events).
# Split out of the one-page home (review of 2026-10-09). The section ids are
# the home's old anchors, so /nos-ateliers#programme, #faq, #events… work.
name: nos-ateliers
path: /nos-ateliers
sitemap:
  priority: 0.9
  changefreq: weekly
meta:
  lang: fr-FR
  title: "Atelier de consentement à Strasbourg - Merci pour ton non"
  description: "Atelier de consentement gratuit à Strasbourg : 3h pour apprendre à dire non et poser ses limites. Programme, infos pratiques, FAQ et prochaines dates."
  author: Merci pour ton non
  robots: index, follow
  canonical: https://mercipourtonnon.fr/nos-ateliers
  openGraph:
    type: website
    title: "Atelier de consentement gratuit à Strasbourg | Merci pour ton non"
    description: "3 heures pour apprendre à dire non, poser tes limites et accueillir celles des autres. Programme, infos pratiques et prochaines dates."
    url: https://mercipourtonnon.fr/nos-ateliers
    image: https://mercipourtonnon.fr/social.png
    imageAlt: "Atelier sur le consentement - Merci pour ton non"
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: "Atelier de consentement gratuit à Strasbourg | Merci pour ton non"
    description: "3 heures pour apprendre à dire non, poser tes limites et accueillir celles des autres. Programme, infos pratiques et prochaines dates."
    image: https://mercipourtonnon.fr/social.png
  keywords: atelier consentement, atelier consentement strasbourg, formation consentement, apprendre dire non, poser limites, atelier consentement gratuit strasbourg
  # FAQ JSON-LD — moved from the home with the FAQ it describes. It earns no
  # rich result since 2026; kept because it matches visible content.
  schema:
      # EducationEvent JSON-LD on /ateliers/:slug (config/pages/atelier.yaml).
    faqPage:
      '@context': https://schema.org
      '@type': FAQPage
      mainEntity:
        - '@type': Question
          name: Je connais déjà le consentement
          acceptedAnswer:
            '@type': Answer
            text: 'Super ! Cet atelier va au-delà de la théorie : tu vas pratiquer concrètement avec des exercices, identifier les biais subtils qui influencent tes choix, et muscler ta capacité à dire "non" dans des situations réelles.'
        - '@type': Question
          name: Je n'ai pas le temps
          acceptedAnswer:
            '@type': Answer
            text: 3 heures, c'est l'équivalent d'un long film. Mais contrairement à un film, tu repars avec des outils pratiques que tu utiliseras toute ta vie pour améliorer toutes tes relations. Un investissement qui vaut le coup !
        - '@type': Question
          name: J'ai peur que ce soit trop intense
          acceptedAnswer:
            '@type': Answer
            text: 'Le cadre est ultra sécurisant : tu n''es jamais obligé·e de partager ton vécu personnel, tu peux juste observer, et tout reste confidentiel. C''est ludique, bienveillant, et 100% respectueux de tes limites.'
        - '@type': Question
          name: Je ne peux pas me le permettre
          acceptedAnswer:
            '@type': Answer
            text: C'est gratuit. Si tu veux et peux, tu fais un don pour soutenir l'association — jamais obligatoire.
        - '@type': Question
          name: C'est vraiment gratuit ?
          acceptedAnswer:
            '@type': Answer
            text: "Oui. L'atelier est gratuit : personne ne paie pour y participer. Si tu veux et peux soutenir l'association, tu peux faire un don sur HelloAsso — c'est lui, et seulement lui, qui ouvre droit à un reçu fiscal (la participation à l'atelier, non). Deux tiers des participant·es ne donnent rien, et c'est très bien."
        - '@type': Question
          name: C'est uniquement sur le consentement sexuel ?
          acceptedAnswer:
            '@type': Answer
            text: 'Non ! L''atelier explore le consentement dans toutes les dimensions : amicales, familiales, professionnelles... Le consentement concerne tous nos rapports humains.'
        - '@type': Question
          name: Je suis timide, vais-je devoir parler ?
          acceptedAnswer:
            '@type': Answer
            text: Tu restes souverain·e ! Tu peux choisir de ne pas participer à certains exercices, juste observer, ou partir quand tu veux. Tout dans la bienveillance.
        - '@type': Question
          name: Je peux venir seul·e ?
          acceptedAnswer:
            '@type': Answer
            text: Bien sûr ! La plupart viennent seul·es. C'est même plus enrichissant pour rencontrer de nouvelles personnes dans un cadre bienveillant.
        - '@type': Question
          name: Je peux annuler ?
          acceptedAnswer:
            '@type': Answer
            text: Oui, tu peux annuler à tout moment ! Préviens-nous juste pour libérer ta place (6 à 15 personnes maximum).
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
