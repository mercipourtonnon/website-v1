    description: "3 heures pour apprendre à dire non, poser tes limites et accueillir celles des autres. Programme, infos pratiques et prochaines dates."
    url: https://mercipourtonnon.fr/nos-ateliers
    image: https://mercipourtonnon.fr/social.png
    imageAlt: "Atelier sur le consentement - Merci pour ton non"
    siteName: Merci pour ton non
    locale: fr_FR
  twitter:
    card: summary_large_image
    title: "Atelier de consentement gratuit à Strasbourg | Merci pour ton non"
    description: "3 heures pour apprendre à dire non, poser tes limites et accueillir celles des autres. Programme, infos pratiques et prochaines dates."
    image: https://mercipourtonnon.fr/social.png
  keywords: atelier consentement, atelier consentement strasbourg, formation consentement, apprendre dire non, poser limites, atelier consentement gratuit strasbourg
  # FAQ JSON-LD — moved from the home with the FAQ it describes. It earns no
  # rich result since 2026; kept because it matches visible content.
  schema:
      # EducationEvent JSON-LD on /ateliers/:slug (config/pages/atelier.yaml).
    faqPage:
      '@context': https://schema.org
      '@type': FAQPage
      mainEntity:
        - '@type': Question
          name: 'Pourquoi participer si je connais déjà le consentement ?'
          acceptedAnswer:
            '@type': Answer
            text: 'L''atelier va au-delà de la théorie : on pratique avec des exercices, on repère les biais qui influencent nos choix et on s''entraîne à dire non dans des situations concrètes.'
        - '@type': Question
          name: 'Est-ce que l''atelier peut être trop intense émotionnellement ?'
          acceptedAnswer:
            '@type': Answer
            text: 'Tu n''as jamais à raconter ton vécu et chaque exercice est facultatif : voir notre cadre plus haut. On est des facilitateur·ices formé·es, pas des thérapeutes.'
        - '@type': Question
          name: 'C''est vraiment gratuit ?'
          acceptedAnswer:
            '@type': Answer
            text: 'Oui, personne ne paie pour participer. Si tu veux et peux soutenir l''association, tu peux faire un don sur HelloAsso : c''est le don, et seulement lui, qui ouvre droit à un reçu fiscal. Deux tiers des participant·es ne donnent rien, et c''est très bien.'
        - '@type': Question
          name: 'C''est uniquement sur le consentement sexuel ?'
          acceptedAnswer:
            '@type': Answer
            text: 'Non. L''atelier explore le consentement dans toutes nos relations : amicales, familiales, professionnelles, amoureuses.'
        - '@type': Question
          name: 'Je suis timide, vais-je devoir parler ?'
          acceptedAnswer:
            '@type': Answer
            text: 'Non. Tu peux observer, passer un exercice ou sortir quand tu veux.'
        - '@type': Question
          name: 'Je peux venir seul·e ?'
          acceptedAnswer:
            '@type': Answer
            text: 'Oui, la plupart des personnes viennent seules.'
        - '@type': Question
          name: 'Je peux annuler ma réservation ?'
          acceptedAnswer:
            '@type': Answer
            text: 'Oui, à tout moment : préviens-nous par email pour libérer ta place.'
  favicons:
    icon: /favicon/favicon-32x32.png
    appleTouchIcon: /favicon/apple-touch-icon.png
    sizes:
