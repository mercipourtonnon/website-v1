      # Section: Events / Réservation (#events) — one card listing every upcoming
      # published date from the `workshops` table (gallery, server-rendered),
      # each row with its own booking link (HelloAsso, one event per date).
      - type: container
        element: section
        props:
          id: events
          className: px-4 sm:px-6 py-band-sm md:py-band bg-orange-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto
            children:
              - type: container
                props:
                  className: text-center mb-12
                children:
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce mb-4
                    content: réserve ta place maintenant
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: Choisis la date qui te convient. Chaque atelier est gratuit — tu peux faire un don si tu le souhaites.
              # Workshop card — one card, six dates, one registration URL.
              - type: container
                props:
                  className: grid gap-8 max-w-2xl mx-auto
                children:
                  - type: container
                    props:
                      className: bg-white rounded-lg p-8 border border-gray-200 border-t-4 border-t-orange shadow-sm flex flex-col gap-6 text-left
                    children:
                      # Title
                      - type: text
                        element: h3
                        props:
                          className: text-2xl title-font text-bleu-fonce
                        content: 'Atelier de consentement - Niveau 1 - Tout public'

                      # Meta details — the practical facts a visitor weighs before
                      # clicking. Times live per-date below, not here.
                      - type: container
                        props:
                          className: flex flex-wrap items-center gap-x-5 gap-y-2 text-gray-600
                        children:
                          - type: container
                            props:
                              className: inline-flex items-center gap-2
                            children:
                              - type: icon
                                props: { name: map-pin, className: w-5 h-5 text-orange }
                              - type: text
                                element: span
                                content: Strasbourg — adresse communiquée aux inscrit·es
                          - type: container
                            props:
                              className: inline-flex items-center gap-2
                            children:
                              - type: icon
                                props: { name: users, className: w-5 h-5 text-orange }
                              - type: text
                                element: span
                                content: 6 à 15 places
                          # Brand orange on white is 1.8:1; orange-ink keeps the hue at 6.2:1.
                          - type: container
                            props:
                              className: inline-flex items-center gap-2 font-bold text-orange-ink
                            children:
                              - type: icon
                                props: { name: coins, className: w-5 h-5 text-orange }
                              - type: text
                                element: span
                                content: gratuit, don libre

                      # Upcoming dates, chronological, drawn on the server. Past
                      # and cancelled dates drop out on their own ($today is the
                      # server's UTC day).
                      - type: list
                        props:
                          aria-label: Prochaines dates
                          className: list-none p-0 m-0 flex flex-col
                        dataSource:
                          table: workshops
                          filter:
                            - { field: status, operator: eq, value: published }
                            - { field: session_date, operator: gte, value: $today }
                          sort: [{ field: starts_at, direction: asc }]
                        listDisplay:
                          emptyMessage: Pas de date ouverte pour l'instant. Inscris-toi à la newsletter pour recevoir les prochaines.
                        children:
                          - type: container
                            visibility: { record: { field: co_name, isNotEmpty: true } }
                            children:
                              - component: event-date-row
                                vars:
                                  date: $record.date_label
                                  time: $record.time_label
                                  facilitators: $record.lead_name & $record.co_name
                                  bookingUrl: $record.booking_url
                                  detailsUrl: /ateliers/$record.slug
                          - type: container
                            visibility: { record: { field: co_name, isEmpty: true } }
                            children:
                              - component: event-date-row
                                vars:
                                  date: $record.date_label
                                  time: $record.time_label
                                  facilitators: $record.lead_name
                                  bookingUrl: $record.booking_url
                                  detailsUrl: /ateliers/$record.slug
                      - type: text
                        element: p
                        props:
                          className: text-sm text-gray-600
                        children:
                          - type: text
                            element: span
                            content: 'Aucune date ne te convient ? '
                          - type: link
                            props:
                              href: /newsletter
                              className: font-bold text-bleu-fonce underline decoration-orange decoration-2 underline-offset-4
                            content: Reçois les prochaines par la newsletter
              - type: container
                props:
                  className: bg-white rounded-card shadow-card p-8 max-w-4xl mx-auto mt-12
                children:
                  # Contact option for questions
                  - type: container
                    props:
                      className: text-center
                    children:
                      - type: text
                        element: h3
                        props:
                          className: text-xl title-font text-bleu-fonce mb-3
                        content: tu as des questions ?
                      - type: text
                        element: p
                        props:
                          className: text-bleu-fonce mb-4
                        content: On est là pour échanger avec toi avant que tu t'inscrives. Aucune question n'est bête, on répond avec plaisir !
                      - type: container
                        props:
                          className: flex flex-col sm:flex-row gap-4 justify-center items-center
                        children:
                          - type: link
                            props:
                              href: mailto:mercipourtonnon@gmail.com
                              className: inline-flex items-center gap-2 text-orange-ink underline underline-offset-4 hover:text-bleu-fonce font-semibold transition-colors
                            children:
                              - type: icon
                                props: { name: mail, className: w-5 h-5 -mt-0.5 }
                              - type: text
                                element: span
                                content: mercipourtonnon@gmail.com
                          - type: text
                            element: span
                            props:
                              className: text-gray-400 hidden sm:inline
                            content: •
                          - type: link
                            props:
                              href: https://www.instagram.com/mercipourtonnon/
                              target: _blank
                              rel: noopener noreferrer
                              className: inline-flex items-center gap-2 text-orange-ink underline underline-offset-4 hover:text-bleu-fonce font-semibold transition-colors
                            children:
                              - type: icon
                                props: { name: arrow-up-right, className: w-5 h-5 -mt-0.5 }
                              - type: text
                                element: span
                                content: Instagram

  - component: site-footer
