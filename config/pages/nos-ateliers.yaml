      # Section: Notre cadre (#cadre) — the safety frame from the BPS (review of
      # 2026-10-09): opt-in exercises, confidentiality, no one put on the spot,
      # punctuality and the two-person minimum; then the help band.
      - type: container
        element: section
        props:
          id: cadre
          className: px-4 sm:px-6 py-band-sm md:py-band
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4 max-w-2xl
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-mauve
                    content: Notre cadre
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: notre cadre
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: Ce qu'on s'engage à tenir, pour que chacun·e puisse explorer à son rythme.
              - type: container
                props:
                  className: grid sm:grid-cols-2 lg:grid-cols-4 gap-6
                children:
                  - component: audience-card
                    vars:
                      icon: hand
                      iconBg: bg-mauve-light
                      accent: text-mauve
                      title: tu participes si tu veux
                      text: "Chaque exercice est facultatif. Observer est une façon de participer, et tu peux sortir quand tu veux."
                  - component: audience-card
                    vars:
                      icon: lock
                      iconBg: bg-mauve-light
                      accent: text-mauve
                      title: ce qui se dit reste ici
                      text: "Confidentialité : rien de ce qui se partage en atelier n'en sort."
                  - component: audience-card
                    vars:
                      icon: shield-check
                      iconBg: bg-mauve-light
                      accent: text-mauve
                      title: personne n'est mis·e en défaut
                      text: "On ne te demande ni de raconter ton vécu, ni de te justifier. L'atelier n'est ni un espace thérapeutique ni un tribunal : on est des facilitateur·ices formé·es, pas des thérapeutes."
                  - component: audience-card
                    vars:
                      icon: clock
                      iconBg: bg-mauve-light
                      accent: text-mauve
                      title: on protège le groupe
                      text: "On commence à l'heure : au-delà de 20 minutes de retard, on ne peut plus t'accueillir. Si deux personnes ou moins sont inscrites, on annule et on te prévient."
              - component: help-now-band

      # Section: Testimonials (#temoignages) — six quotes, each exists once on
      # this page (the home quotes Leyla's as its excerpt). Three featured
      # quotes (larger), then one CSS-columns list.
      - type: container
        element: section
        props:
          id: temoignages
          className: px-4 sm:px-6 py-band-sm md:py-band bg-pourpre-light
        children:
          - type: container
            props:
              className: max-w-7xl mx-auto flex flex-col gap-block
            children:
              - type: container
                props:
                  className: flex flex-col gap-4 max-w-2xl
                children:
                  - type: text
                    element: p
                    props:
                      className: type-overline text-pourpre-hover
                    content: Témoignages
                  - type: text
                    element: h2
                    props:
                      className: type-section text-bleu-fonce
                    content: ce que les participant·es en disent
                  - type: text
                    element: p
                    props:
                      className: type-lead text-bleu-fonce-70
                    content: Des personnes qui sont venues, et qui en parlent mieux que nous.
              - type: container
                props:
                  className: grid lg:grid-cols-3 gap-6 items-start
                children:
                  - component: testimonial-card
                    vars:
                      size: type-lead
                      quote: "C'est la première fois que je participais à un atelier autour de la notion de consentement, et première fois tout court que je participais à un atelier militant, et ce fût une très belle première fois ! […] je me suis sentie en sécurité et à l'aise pour participer facilement. Le contenu en lui-même a été très intéressant et m'a apporté des notions nouvelles alors que je pensais déjà être assez calée sur le sujet. Les exercices pratiques sont un vrai plus ! […]"
                      author: Leyla
                  - component: testimonial-card
                    vars:
                      size: type-lead
                      quote: "En tant qu'homme cis, je craignais que la question du consentement ne soit abordée que par le prisme des violences sexistes, dans lesquelles les hommes sont très majoritairement mis en cause. Mais l'angle de l'atelier était bien plus large que ça, et mettait en lumière le fait que poser ses limites, et dépasser les limites d'autrui, était sans rapport avec les questions de genre."
                      author: Pierre
                  - component: testimonial-card
                    vars:
                      size: type-lead
                      quote: "Une très belle expérience à partager! Venu en couple, j'avais un peu d'appréhension à l'idée de parler de moi ou de nous. La force de l'atelier est d'approcher le consentement avec des exemples simples, progressifs et du quotidien : \"tu me prêtes ton crayon? ...\". Une prise de recul qui permet d'approcher la notion de manière sereine. Merci beaucoup."
                      author: Nicolas
              - type: container
                props:
                  className: wall-of-love
                children:
                  - component: testimonial-card
                    vars:
                      size: type-body
                      quote: "Belle expérience enrichissante. Un collectif motivé, engagé et respectueux qui nous a donné la possibilité de réfléchir et de s'exprimer sur une notion complexe et évolutive, souvent mal comprise dans notre société. Je repars avec des questions, des envies de revenir en discuter et des pistes pour améliorer mes propres relations interpersonnelles."
                      author: Sam
                  - component: testimonial-card
                    vars:
                      size: type-body
                      quote: "Je recommande cet atelier à tout le monde, que vous ayez déjà des connaissances sur le sujet du consentement (et pas que sexuel) ou non, vous y apprendrez forcément des choses dans un cadre cool et bienveillant ! Je repars avec plein de clés pour m'affirmer et oser dire non."
                      author: Lou
                  - component: testimonial-card
                    vars:
                      size: type-body
                      quote: "Cet atelier aurait le mérite d'être proposé en milieu professionnel, en milieu associatif, dans les lycées, dans les facs, sur les sites de rencontres amoureux et amicaux, et partout dans le monde en fait. J'ai encore appris de nouvelles choses sur moi-même et sur les relations interpersonnelles en général. Ça fait grandir et c'est inspirant."
                      author: Alex

