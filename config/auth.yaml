# Authentication, and the circles and volunteer roles of the internal
# governance (Notion « 🎯 Gouvernance interne », 2026-10).
#
# Anyone may create an account (allowSignUp: true). A new account is a
# `candidat`: it sees only /espace/en-attente until the Cercle Gardien validates
# it (validate-member → role `member`, i.e. the Cercle Abeilles). Invitations
# from an admin or a gardien·ne keep working, and the first admin still comes
# from AUTH_ADMIN_EMAIL / AUTH_ADMIN_PASSWORD or `sovrium admin create`.
#
# CIRCLE = ROLE (exactly one per account, changed in the console « Changer le rôle »)
#   candidat  5   candidature awaiting validation
#   member    40  Cercle Abeilles: adhérent·e, occasional help
#   coeur     50  Cercle Cœur: active member holding at least one volunteer role
#   gardien   80  Cercle Gardien: direction collégiale. Level 80 makes it the
#                 app's top role, so it is admin-equivalent (governance: « Tout »)
#   admin     80  built-in, technical operator
#
# VOLUNTEER ROLE = GROUP (any number per account; `group:<name>` in permissions)
#   Membership is runtime state: tick « Rôles bénévoles » on the member's
#   profile (/espace/coordination/membres) and sync-member-groups applies it.
#   facilitation, logistique, communication, tresorerie, polyvalent.
#
# Sovrium limits (still so in 0.40) that decide where a right can live:
#   - row rules compare `$currentUser.role` only, so "sees every row" is a role
#     (the editor_role columns), never a group;
#   - a field `write` grant and a manual automation's requiredRole /
#     permissions.trigger read the role only, so approving a proposal and
#     validating a member stay with the Cercle Gardien.
#
# Permission lists do not inherit, so they spell their roles out:
#   member+  = [member, coeur, gardien, admin]
#   coeur+   = [coeur, gardien, admin]
#   gardien+ = [gardien, admin]
strategies:
  - type: emailAndPassword
  - type: magicLink
    # Volunteers often open the mail later, on their phone.
    expirationMinutes: 30
allowSignUp: true
defaultRole: candidat
invitationTokenExpiry: 7d
# Post-login resolver: a session sent here is redirected to its role's
# defaultLanding below (sign-in forms use onSuccess: role-landing). Needs a page
# at this exact path with `access: { require: authenticated, redirectTo: /connexion }`
# and no content — it is the guard for anonymous visitors (auth-access/auth-assignments).
landingPath: /espace/arrivee
roles:
  # Built-in (level 80). Listed FIRST on purpose: an admin is sent to the first
  # role's defaultLanding (auth/auth-overview, role-landing), which would
  # otherwise be candidat's /espace/en-attente.
  - { name: admin, defaultLanding: /espace }
  # Signed up, profile awaiting validation by the Cercle Gardien.
  - name: candidat
    description: Candidature en attente de validation
    level: 5
    defaultLanding: /espace/en-attente
  # Built-in (level 40): Cercle Abeilles, a validated bénévole.
  - name: member
    defaultLanding: /espace
  - name: coeur
    description: Cercle Cœur — membre actif·ve qui porte au moins un rôle bénévole
    level: 50
    defaultLanding: /espace
  # Validates members and workshop dates, changes circles, assigns volunteer
  # roles. canInvite is implied by admin-equivalence; kept explicit.
  - name: gardien
    description: Cercle Gardien — direction collégiale
    level: 80
    canInvite: true
    defaultLanding: /espace
# Volunteer roles (Notion « 🦸 Rôles », Cercle Cœur). « Expérience
# participant·es » is inactive in Notion, so it has no group yet.
groups:
  - name: facilitation
    description: Facilitateur·ice — anime des ateliers de consentement de qualité
  - name: logistique
    description: Logisticien·ne — salles, agenda, billetterie et matériel des ateliers
  - name: communication
    description: Communication — visibilité de l'association, actualités, réseaux
  - name: tresorerie
    description: Trésorerie — suivi des finances, des dons et des recettes des ateliers
  - name: polyvalent
    description: Contributeur·ice polyvalent·e — appui régulier là où il y a besoin
# Self-service API keys: an admin mints the key scripts/import-notion.mjs uses
# (SOVRIUM_ADMIN_API_KEY).
apiKeys: true
emailTemplates:
  magicLink:
    subject: Ton lien de connexion à l'espace bénévole
    text: |
      Salut $name,

      Voici ton lien pour te connecter à l'espace bénévole de Merci pour ton non :
      $url

      Il reste valable 30 minutes et ne sert qu'une fois. Si tu n'as rien demandé, tu peux simplement ignorer ce message.

      À très vite,
      L'équipe de Merci pour ton non
  welcome:
    subject: Bienvenue dans l'espace bénévole de Merci pour ton non
    text: |
      Salut $name,

      Merci d'avoir rejoint l'espace bénévole ! Ton compte est bien créé.

      Prochaine étape : complète ta fiche bénévole pour qu'on apprenne à te connaître. La coordination la relit et valide ton accès dans les prochains jours ; tu recevras un message dès que c'est fait.

      Ensemble, on construit une culture du consentement, à notre rythme.

      L'équipe de Merci pour ton non
  invitation:
    subject: $inviterName t'invite à rejoindre l'espace bénévole de Merci pour ton non
    text: |
      Salut,

      $inviterName t'invite à rejoindre l'espace bénévole de Merci pour ton non : l'agenda des rencontres et des événements, les actualités de l'asso, l'annuaire des bénévoles et le lien vers notre communauté WhatsApp.

      Pour accepter et choisir ton mot de passe, suis ce lien :
      $url

      Le lien est valable 7 jours. Si tu ne t'attendais pas à ce message, tu peux l'ignorer.

      À très vite,
      L'équipe de Merci pour ton non
