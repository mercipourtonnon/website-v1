# Design system — tokens + brand charter (replaces the former /charte page).
# Rendered by /_admin/design-system and exported by `sovrium design-system app.yaml`.
# Color names match the original Tailwind theme so classNames like
# bg-pourpre-light or text-bleu-fonce carry over unchanged.
baseline: extend
colorScheme: light

colors:
  pourpre: '#F5004F'
  pourpre-hover: '#D10042'
  pourpre-light: '#FFF0F5'
  pourpre-lighter: '#FFE0EA'

  orange: '#FFAF00'
  orange-hover: '#E69E00'
  orange-light: '#FFF8E6'
  orange-lighter: '#FFF0D1'
  # Encre orange — the only orange that reads as small text on white (6.2:1).
  orange-ink: '#8F5200'
  orange-vif: '#FF7000'
  orange-vif-light: '#FFF4E6'

  mauve: '#7B01FE'
  mauve-hover: '#6A01DB'
  mauve-light: '#F3E6FF'
  mauve-lighter: '#E6D1FF'

  cyan: '#12A19D'
  cyan-hover: '#0F8A87'
  cyan-light: '#E6F9F8'
  cyan-lighter: '#D1F2F0'
  # Encre cyan — cyan itself is 3.2:1 on white; this reads at 6.1:1.
  cyan-ink: '#0B6E6B'

  # Bleu foncé — remplace le noir pour plus de cohérence avec la palette
  bleu-fonce: '#130077'
  bleu-fonce-light: '#E6E0FF'
  # Alpha variants (the renderer's class merge drops `/50`-style opacity
  # modifiers on link components, so they get dedicated tokens)
  bleu-fonce-50: '#13007780'
  bleu-fonce-70: '#130077B3'

  # Platform role tokens — Sovrium's own components (default buttons, banners,
  # alerts) read these. Mapped to the brand so nothing renders near-black.
  primary: '#130077' # bleu foncé — white text on it is 16.2:1
  primary-hover: '#24109A'
  primary-active: '#0C004F'
  primary-fg: '#FFFFFF'
  primary-foreground: '#FFFFFF'
  primary-subtle: '#E6E0FF'
  primary-subtle-fg: '#130077'
  warning: '#FFF8E6' # orange-light — bleu-foncé text 15.3:1
  warning-fg: '#130077'
  warning-foreground: '#130077'
  warning-bg: '#FFF8E6'
  warning-border: '#FFAF00'
  success: '#E6F9F8' # cyan-light — bleu-foncé text 14.9:1
  success-fg: '#130077'
  success-foreground: '#130077'
  success-bg: '#E6F9F8'
  success-border: '#12A19D'

typeScale:
  families:
    title:
      family: Bely Display
      fallback: Archivo Black, cursive
      transform: lowercase
      letterSpacing: 0.05em
      # Local stylesheet carrying the @font-face rules (and global site styles).
      # Rendered as a <link rel="stylesheet"> on every page.
      url: /assets/site.css
    body:
      family: Neue Machina
      fallback: Space Grotesk, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif
      # The three @font-face weights (300 / 400 / 800) are declared in site.css.
  # Hiérarchie des titres / corps de texte.
  # Steps are fixed sizes (px/rem only); responsive headings pair two steps,
  # e.g. `text-h2 md:text-h1` — mobile never gets the 4.5rem display size.
  steps:
    display: { size: '4.5rem', lineHeight: 0.95, font: title } # 72px — hero only, ≥ lg
    h1: { size: '3.25rem', lineHeight: 1, font: title } # 52px — page title (desktop)
    h2: { size: '2.375rem', lineHeight: 1.1, font: title } # 38px — section title (desktop) / page title (mobile)
    h3: { size: '1.75rem', lineHeight: 1.15, font: title } # 28px — section title (mobile)
    h4: { size: '1.375rem', lineHeight: 1.25, font: title } # 22px — card titles
    lead: { size: '1.25rem', lineHeight: 1.6, weight: 400, font: body } # standfirst under a title
    body: { size: '1.0625rem', lineHeight: 1.7, weight: 400, font: body } # 17px, interlignage 1.6–1.8
    bodySmall: { size: '0.9375rem', lineHeight: 1.6, weight: 400, font: body } # "texte léger" 14–16px
    caption: { size: '0.875rem', lineHeight: 1.5, weight: 400, font: body } # légendes, métadonnées
    overline: { size: '0.8125rem', lineHeight: 1.4, weight: 800, letterSpacing: '0.06em', font: body } # sur-titre de section

# Rythme vertical — one section step, one block step; Tailwind's numeric
# ladder (4px base) stays available for spacing inside components.
spacing:
  band: '6rem' # between sections, desktop
  band-sm: '4rem' # between sections, mobile
  block: '3rem' # between a section's heading and its content

# Coins — small on controls, larger on surfaces, largest on photos.
radius:
  control: '0.75rem'
  card: '1.5rem'
  media: '2rem'
  pill: '9999px'

# Une seule ombre douce, teintée bleu foncé (jamais noire, jamais colorée vive).
elevation:
  card: '0 1px 2px rgb(19 0 119 / 0.04), 0 12px 32px -12px rgb(19 0 119 / 0.14)'
  raised: '0 2px 4px rgb(19 0 119 / 0.05), 0 24px 48px -16px rgb(19 0 119 / 0.22)'

# Nos principes (ordonnés)
principles:
  - "Authenticité — design sincère et transparent, pas de surenchère visuelle ni de promesses exagérées."
  - "Respect et accessibilité — hiérarchie claire, contrastes élevés, espaces généreux pour tou·tes."
  - "Dialogue et ouverture — un ton chaleureux qui invite à l'échange plutôt qu'à la performance."
  - "Simplicité engagée — épuré sans être froid, chaleureux sans être infantilisant ; associatif assumé, loin des codes startup et corporate."

# Logo & identité
logo:
  src: /logo.svg
  alt: Merci pour ton non
  misuse:
    - "Ne jamais recolorer le logo : chaque mot garde sa couleur (pourpre merci, orange pour, mauve ton, cyan non)."
    - Ne jamais l'étirer, le tourner ou lui ajouter des effets.
    - Le poser uniquement sur fond blanc, fond coloré clair ou fond sombre.
  # clearSpace / minWidth omitted: the charte never stated them (do not invent).

# Règles d'usage des couleurs — keys MUST be declared in `colors`
colorRoles:
  pourpre:
    usage: "Émotion, authenticité, découverte. Témoignages, sections émotionnelles. Jamais en fond de grande section : utiliser pourpre-light."
    pairsWith: pourpre-light
  orange:
    usage: "Action, engagement, chaleur. Boutons d'inscription, CTAs principaux, liens actifs — en fond, toujours avec un texte bleu-fonce (8,8:1), jamais blanc (1,8:1). Jamais pour une action contradictoire (annuler ET confirmer)."
    pairsWith: orange-light
  orange-ink:
    usage: "Version texte de l'orange : petits libellés, liens et sur-titres orange sur fond blanc ou clair. L'orange vif n'est jamais du texte (1,8:1)."
    pairsWith: orange-light
  orange-vif:
    usage: "Variante chaude, en opposition au violet. Accent ponctuel uniquement."
    pairsWith: orange-vif-light
  mauve:
    usage: "Exploration, apprentissage, créativité. Sections pédagogiques, titres secondaires, invitations à la réflexion."
    pairsWith: mauve-light
  cyan:
    usage: "Validation, calme, ressources. Confirmations, ressources, sections factuelles. Pas en petit texte sur fond blanc (contraste) : utiliser cyan-ink."
    pairsWith: cyan-light
  cyan-ink:
    usage: "Version texte du cyan : libellés, liens et titres de cartes cyan sur fond blanc ou cyan-light."
    pairsWith: cyan-light
  bleu-fonce:
    usage: "Texte principal et titres ; remplace le noir partout."
    pairsWith: pourpre-light

# Tonalité & voix
voice:
  pronoun: tu
  personality:
    - Bienveillant mais pas moralisateur.
    - Pédagogue mais pas condescendant.
    - Engagé mais pas militant.
    - Accessible mais pas simpliste.
  prefer:
    - "Tutoyer systématiquement et utiliser l'écriture inclusive (·e, ·es)."
    - "Vocabulaire : consentement, limites, authenticité, écoute, co-construction ; poser ses limites, accueillir le non, explorer, construire ensemble."
    - "Formuler comme une invitation : « Rejoins-nous pour explorer… », « Cet atelier t'invite à… », « Ensemble, on construit… »."
    - Privilégier la clarté à l'effet de style.
  avoid:
    - "Jargon corporate : solution, optimisation, performance, ROI, levier."
    - "Ton marketing : révolutionnaire, unique, certifiant, garantie, « maximisez votre potentiel », « devenez un expert »."
    - "Vocabulaire thérapeutique : guérison, trauma, diagnostic."
    - Vouvoiement, ton moralisateur, promesses de résultat.

# Photographie & visuels + Motifs
imagery:
  iconSet: lucide
  principles:
    - Des photos de vrais ateliers, jamais d'illustrations génériques ; mieux vaut attendre une vraie photo qu'un visuel qui ne nous représente pas.
    - "Les couleurs de marque sont réservées aux éléments stratégiques : logo, titres, boutons, icônes."
    - "Hiérarchie : icônes colorées pour les concepts et actions, photos authentiques pour les personnes."
  photography:
    - "Tout visuel est consenti : accord explicite avant d'utiliser une photo de personne identifiable."
    - Moments spontanés ; mains, gestes, interactions non verbales, expressions sincères.
    - Lumière naturelle, tons chauds ; proximité, cercles, petits groupes.
    - Représentation variée des âges, origines, corps et genres.
    - "À éviter : stock lisse, esthétique corporate, postures figées, groupes homogènes, éclairage dur."
  patterns:
    - "Icônes Lucide (trait 2px, 16/24/32–48px) dans les 4 couleurs de marque, pour l'humain et les émotions (heart, ear, shield, hands) — jamais d'emojis, pas de look SaaS."
    - Cercles qui se chevauchent (rencontres, co-construction) en fond subtil.
    - Lignes ondulées (fluidité, respect des limites) en filigrane très léger.
    - "Formes géométriques colorées et dégradés clairs (pourpre-light, orange-light, mauve-light, cyan-light) comme fonds ; jamais les teintes vives en fond de section."
    - "Photos en cadre arrondi (rounded-media) avec un cercle de couleur de marque décalé derrière ; jamais en pleine largeur façon stock, jamais de flou ni de blob animé."
    - "Une couleur d'accent par section, choisie selon son rôle (colorRoles) ; fonds de section en blanc ou en une seule teinte -light."
