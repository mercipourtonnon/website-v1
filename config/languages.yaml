# The app speaks French only. Declaring it makes the words Sovrium writes itself
# (form errors, "Not set", grid toolbars, dialog buttons, date formats) French,
# instead of the English default (app-schema/languages, "Built-in strings").
# One language: no switcher, nothing to remember, no browser detection.
default: fr
supported:
  - code: fr
    locale: fr-FR
    label: Français
    direction: ltr
detectBrowser: false
persistSelection: false
